<title>Ofertix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f0d'/%3E%3Cpath d='M9 7h9l7 7-11 11-7-7V9a2 2 0 0 1 2-2z' fill='%232ee68f'/%3E%3Ccircle cx='13' cy='12' r='2' fill='%230b0f0d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f5;--surface:#ffffff;--surface-2:#eef3f0;--borda:#dbe4de;--texto:#0f1a14;--texto-2:#4a5a51;--mudo:#7a8a81;
  --verde:#0c9f5f;--verde-forte:#08824d;--verde-suave:#dff6ea;--laranja:#d9601a;--laranja-suave:#fde9dc;--vermelho:#c9302c;--vermelho-suave:#fbe3e2;--amarelo:#a66a00;--amarelo-suave:#fff1d1;
  --serie-a:#0FA968;--serie-b:#E86A1A;--sobre-verde:#ffffff;--grade:#e6ece8;--sombra:0 1px 2px rgba(15,26,20,.06),0 8px 24px rgba(15,26,20,.06);
  --raio:14px;--fonte-titulo:'Space Grotesk',system-ui,sans-serif;--fonte:'Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0f0d;--surface:#121815;--surface-2:#171f1b;--borda:#212c26;--texto:#e7efe9;--texto-2:#a3b3a9;--mudo:#6f8076;
  --verde:#2ee68f;--verde-forte:#22c97a;--verde-suave:rgba(46,230,143,.12);--laranja:#ff9a55;--laranja-suave:rgba(255,138,61,.14);--vermelho:#ff6b66;--vermelho-suave:rgba(255,107,102,.13);--amarelo:#f5c04a;--amarelo-suave:rgba(245,192,74,.13);
  --serie-a:#12A862;--serie-b:#E0641C;--sobre-verde:#062012;--grade:#1c2621;--sombra:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f0d;--surface:#121815;--surface-2:#171f1b;--borda:#212c26;--texto:#e7efe9;--texto-2:#a3b3a9;--mudo:#6f8076;
    --verde:#2ee68f;--verde-forte:#22c97a;--verde-suave:rgba(46,230,143,.12);--laranja:#ff9a55;--laranja-suave:rgba(255,138,61,.14);--vermelho:#ff6b66;--vermelho-suave:rgba(255,107,102,.13);--amarelo:#f5c04a;--amarelo-suave:rgba(245,192,74,.13);
    --serie-a:#12A862;--serie-b:#E0641C;--sobre-verde:#062012;--grade:#1c2621;--sombra:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--texto);font:14px/1.45 var(--fonte);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
h1,h2,h3{font-family:var(--fonte-titulo);letter-spacing:-.01em;margin:0}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Menu lateral */
.lateral{background:var(--surface);border-right:1px solid var(--borda);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:700 22px var(--fonte-titulo);letter-spacing:-.02em}
.marca svg{flex:none}
.marca b{color:var(--verde)}
.grupo-menu{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mudo);padding:14px 12px 6px}
.item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--texto-2);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.item:hover{background:var(--surface-2);color:var(--texto)}
.item.ativo{background:var(--verde-suave);color:var(--verde);font-weight:600}
.item svg{width:18px;height:18px;flex:none}
.item .cont{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--texto-2);border-radius:99px;padding:1px 8px}
.rodape-menu{margin-top:auto;padding:12px;border-top:1px solid var(--borda);display:flex;flex-direction:column;gap:8px}
.plano{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--texto-2)}
.selo{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--verde-suave);color:var(--verde)}
/* Topo */
.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda);padding:12px 28px;display:flex;align-items:center;gap:12px}
.colar{flex:1;min-width:0;max-width:640px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--borda);border-radius:12px;padding:0 6px 0 12px;height:42px}
.colar:focus-within{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-suave)}
.colar input{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.colar svg{color:var(--mudo);flex:none}
.icone-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--borda);background:var(--surface);cursor:pointer;color:var(--texto-2);flex:none}
.icone-btn:hover{color:var(--texto)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--verde);color:var(--sobre-verde);font-weight:700;flex:none}
.so-celular{display:none}
.conteudo{padding:26px 28px 60px;max-width:1240px;width:100%}
.aviso-demo{margin:14px 28px 0;padding:10px 14px;border-radius:12px;background:var(--amarelo-suave);color:var(--amarelo);font-size:13px;display:flex;gap:10px;align-items:center}
/* Blocos */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cabeca h1{font-size:26px;display:flex;align-items:center;gap:10px}
.cabeca h1 svg{color:var(--verde)}
.cabeca p{margin:4px 0 0;color:var(--texto-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--borda);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--texto-2)}
.chip:hover{color:var(--texto)}
.chip.ativo{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde);font-weight:600}
.cartao{background:var(--surface);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--verde-suave);color:var(--verde)}
.kpi .ico.l{background:var(--laranja-suave);color:var(--laranja)}
.kpi .ico.a{background:var(--amarelo-suave);color:var(--amarelo)}
.kpi .ico.v{background:var(--vermelho-suave);color:var(--vermelho)}
.kpi .valor{font:700 28px/1 var(--fonte-titulo);letter-spacing:-.02em}
.kpi .valor small{font-size:15px;color:var(--mudo);font-weight:500}
.kpi .rot{color:var(--texto-2);font-size:13px}
.grade-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.bloco{padding:18px 20px}
.bloco h2{font-size:16px;margin-bottom:2px}
.bloco .sub{color:var(--mudo);font-size:12.5px;margin:0 0 14px}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--verde);color:var(--sobre-verde);white-space:nowrap}
.botao:hover{background:var(--verde-forte)}
.botao{text-decoration:none}
.botao.sec{background:var(--surface);border-color:var(--borda);color:var(--texto)}
.botao.sec:hover{background:var(--surface-2)}
.botao.perigo{background:var(--vermelho-suave);color:var(--vermelho)}
.botao.peq{padding:6px 11px;font-size:13px}
.botao:disabled{opacity:.55;cursor:not-allowed}
/* Gráficos */
.grafico{position:relative}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico text{fill:var(--mudo);font-size:11px;font-family:var(--fonte)}
.dica{position:absolute;pointer-events:none;background:var(--texto);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.dica b{font-weight:600}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--texto-2);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Listas */
.linhas{display:flex;flex-direction:column}
.linha{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--borda)}
.linha:first-child{border-top:0}
.miniatura{width:46px;height:46px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.miniatura img{width:100%;height:100%;object-fit:cover}
.linha .meio{flex:1;min-width:0}
.linha .tit{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .det{color:var(--mudo);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.loja{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.loja.shopee{background:#ee4d2d;color:#fff}.loja.mercadolivre{background:#ffe600;color:#2d3277}.loja.amazon{background:#232f3e;color:#ff9900}.loja.magalu{background:#0086ff;color:#fff}.loja.outra{background:var(--surface-2);color:var(--texto-2)}
.status{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.pendente{background:var(--amarelo-suave);color:var(--amarelo)}
.status.enviando{background:var(--verde-suave);color:var(--verde)}
.status.enviado,.status.conectado,.status.concluido,.status.ativo{background:var(--verde-suave);color:var(--verde)}
.status.erro,.status.desconectado,.status.cancelado{background:var(--vermelho-suave);color:var(--vermelho)}
.status.conectando{background:var(--amarelo-suave);color:var(--amarelo)}
/* Ofertas */
.grade-ofertas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.oferta{display:flex;flex-direction:column;overflow:hidden}
.oferta .foto{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;font-size:64px;position:relative}
.oferta .foto img{width:100%;height:100%;object-fit:cover}
.oferta .foto .loja{position:absolute;left:10px;bottom:10px}
.oferta .foto .off{position:absolute;right:10px;top:10px;background:var(--laranja);color:#fff;font:700 12px var(--fonte-titulo);padding:3px 8px;border-radius:6px}
.oferta .foto .capt{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--texto-2);font-size:11px;padding:3px 8px;border-radius:6px}
.oferta .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.oferta .nome{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.precos{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.precos s{color:var(--mudo);font-size:12px}
.precos b{font:700 18px var(--fonte-titulo);color:var(--verde)}
.comissao{font-size:12px;color:var(--texto-2)}
.oferta .acoes{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.oferta .acoes .botao{flex:1}
.vazio{padding:40px 20px;text-align:center;color:var(--mudo)}
.vazio svg{color:var(--verde);margin-bottom:10px}
.vazio h3{color:var(--texto);margin-bottom:6px}
.colar-grande{display:flex;gap:8px;padding:16px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.colar-grande .campo{flex:1;min-width:220px}
/* Tabelas */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mudo);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--borda)}
.tabela td{padding:11px 12px;border-bottom:1px solid var(--borda)}
.tabela tr:last-child td{border-bottom:0}
.tabela .num{text-align:right;font-variant-numeric:tabular-nums}
.rolagem{overflow-x:auto}
/* Interruptor */
.inter{position:relative;width:40px;height:23px;flex:none;display:inline-block}
.inter input{opacity:0;width:0;height:0;position:absolute}
.inter span{position:absolute;inset:0;border-radius:99px;background:var(--borda);transition:.15s;cursor:pointer}
.inter span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.inter input:checked+span{background:var(--verde)}
.inter input:checked+span::after{transform:translateX(17px)}
.inter input:focus-visible+span{outline:2px solid var(--verde);outline-offset:2px}
.inter input:disabled+span{opacity:.5;cursor:not-allowed}
/* Formulários */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12.5px;font-weight:600;color:var(--texto-2)}
.campo input,.campo select,.campo textarea{background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-suave)}
.campo textarea{resize:vertical;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.campo .ajuda{font-size:12px;color:var(--mudo)}
.form-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.secao-form{padding:20px;margin-bottom:16px}
.secao-form h2{font-size:16px;margin-bottom:4px}
.secao-form>p{color:var(--mudo);margin:0 0 16px;font-size:13px}
.linha-inter{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
/* WhatsApp prévia */
.zap{background:#0b141a;border-radius:14px;padding:16px;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px}
.bolha{background:#005c4b;color:#e9edef;border-radius:10px 10px 2px 10px;padding:6px 8px 18px;max-width:330px;margin-left:auto;position:relative;font-size:13.5px;white-space:pre-wrap;word-break:break-word;font-family:var(--fonte)}
.bolha .img{max-height:210px;border-radius:8px;background:#0a3b31;display:grid;place-items:center;font-size:72px;aspect-ratio:4/3;margin-bottom:6px;overflow:hidden}
.bolha .img img{width:100%;height:100%;object-fit:cover}
.bolha .hora{position:absolute;right:8px;bottom:4px;font-size:10.5px;color:#9fc6bd}
.bolha s{opacity:.75}
/* Modal */
.fundo{position:fixed;inset:0;background:rgba(5,10,7,.6);z-index:20;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.modal-cab h2{font-size:19px}
.modal-corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.lista-grupos{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--borda);border-radius:10px;padding:6px}
.lista-grupos label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.lista-grupos label:hover{background:var(--surface-2)}
.lista-grupos input{accent-color:var(--verde);width:16px;height:16px}
.lista-grupos small{margin-left:auto;color:var(--mudo)}
.segmento{display:inline-flex;background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:3px}
.segmento button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--texto-2);font-size:13px}
.segmento button.ativo{background:var(--surface);color:var(--texto);font-weight:600;box-shadow:var(--sombra)}
/* Números */
.numeros{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.numero{padding:18px;display:flex;flex-direction:column;gap:12px}
.numero .topo-n{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qr{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;aspect-ratio:1;max-width:240px;margin:0 auto;width:100%}
.qr img{width:100%;height:auto}
.dicas-ban{padding:18px 20px;margin-top:16px}
.dicas-ban ul{margin:8px 0 0;padding-left:18px;color:var(--texto-2)}
.dicas-ban li{margin:4px 0}
/* Avisos */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--texto);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:40;font-weight:500;box-shadow:var(--sombra);max-width:calc(100vw - 32px)}
.toast.erro{background:var(--vermelho);color:#fff}
.carregando{color:var(--mudo);padding:30px;text-align:center}
.avisos{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alerta{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:13.5px;text-decoration:none;border:1px solid transparent}
.alerta svg{flex:none}
.alerta.erro{background:var(--vermelho-suave);color:var(--vermelho)}
.alerta.atencao{background:var(--amarelo-suave);color:var(--amarelo)}
.alerta.info{background:var(--surface);border-color:var(--borda);color:var(--texto-2)}
.alerta span{flex:1;min-width:0}
.alerta b{font-weight:600;white-space:nowrap}
.rank{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--borda)}
.rank:first-child{border-top:0}
.rank .pos{width:22px;font:700 13px var(--fonte-titulo);color:var(--mudo);text-align:center;flex:none}
.rank .meio{flex:1;min-width:0}
.rank .barra{height:4px;border-radius:4px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.rank .barra i{display:block;height:100%;border-radius:4px;background:var(--serie-a)}
.rank .val{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rank .val b{font:700 15px var(--fonte-titulo)}
.rank .val small{display:block;color:var(--mudo);font-size:11.5px}
.oferta .foto .esg{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font:700 14px var(--fonte-titulo);letter-spacing:.06em;text-transform:uppercase}
.oferta .foto .vit{position:absolute;right:10px;bottom:10px;background:var(--verde);color:var(--sobre-verde);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.metricas{display:flex;gap:10px;font-size:12px;color:var(--texto-2);flex-wrap:wrap}
.botao.estrela.ativa{background:var(--verde-suave);color:var(--verde);border-color:transparent}
.motivo{color:var(--texto-2);font-size:12.5px;margin-top:3px}
.tag-origem{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em}
.lote textarea{min-height:130px}
.resultado-lote{margin:-6px 0 16px;padding:12px 16px;font-size:13px}
.resultado-lote li{margin:3px 0}
.campo-mini{background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:7px 10px;outline:none}
.campo-mini:focus{border-color:var(--verde)}
.dica-var{font-size:12px;color:var(--verde);background:var(--verde-suave);border-radius:8px;padding:6px 10px}
.oculto{display:none!important}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sombra)}

const rotuloDia = (d) => { const [, m, dd] = d.split('-'); return `${dd}/${m}`; };

/** Barras de uma série (envios por dia). */
function graficoBarras(serie, chave, nome) {
  const L = 640, A = 220, m = { t: 12, r: 8, b: 26, l: 34 };
  const max = Math.max(4, ...serie.map((s) => s[chave]));
  const passo = Math.pow(10, Math.floor(Math.log10(max))) / (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 0.5 : 1);
  const topo = Math.ceil(max / passo) * passo;
  const w = (L - m.l - m.r) / serie.length, bw = Math.max(4, Math.min(28, w - 6));
  const y = (v) => m.t + (A - m.t - m.b) * (1 - v / topo);
  let g = '';
  for (let v = 0; v <= topo; v += passo) g += `<line x1="${m.l}" x2="${L - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
  const cada = Math.ceil(serie.length / 8);
  serie.forEach((s, i) => {
    const x = m.l + i * w + (w - bw) / 2, h = A - m.b - y(s[chave]);
    if (s[chave] > 0) g += `<path d="M${x},${A - m.b}V${y(s[chave]) + Math.min(4, h)}q0,-4 4,-4h${bw - 8}q4,0 4,4V${A - m.b}z" fill="var(--serie-a)"/>`;
    g += `<rect x="${m.l + i * w}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-dica="<b>${rotuloDia(s.dia)}</b><br>${num(s[chave])} ${esc(nome)}"/>`;
    if (i % cada === 0) g += `<text x="${m.l + i * w + w / 2}" y="${A - 8}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
  });
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="${esc(nome)} por dia">${g}</svg><div class="dica"></div></div>`;
}

/** Linha do total de participantes. */
function graficoLinha(serie) {
  const L = 640, A = 220, m = { t: 14, r: 10, b: 26, l: 52 };
  const vals = serie.map((s) => s.total);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 10) { min -= 5; max += 5; }
  const folga = (max - min) * 0.15; min = Math.max(0, Math.floor(min - folga)); max = Math.ceil(max + folga);
  const x = (i) => m.l + (serie.length < 2 ? 0 : (i * (L - m.l - m.r)) / (serie.length - 1));
  const y = (v) => m.t + (A - m.t - m.b) * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = Math.round(min + ((max - min) * k) / 4); g += `<line x1="${m.l}" x2="${L - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`; }
  const pts = serie.map((s, i) => `${x(i)},${y(s.total)}`).join(' ');
  g += `<polygon points="${m.l},${A - m.b} ${pts} ${x(serie.length - 1)},${A - m.b}" fill="var(--serie-a)" opacity=".1"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="var(--serie-a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const cada = Math.ceil(serie.length / 8);
  const w = (L - m.l - m.r) / Math.max(1, serie.length - 1);
  serie.forEach((s, i) => {
    if (i % cada === 0) g += `<text x="${x(i)}" y="${A - 8}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
    g += `<rect x="${x(i) - w / 2}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-ponto="${x(i)},${y(s.total)}" data-dica="<b>${rotuloDia(s.dia)}</b><br>${num(s.total)} participantes<br>+${num(s.entrou)} / −${num(s.saiu)}"/>`;
  });
  const ult = serie[serie.length - 1];
  g += `<circle cx="${x(serie.length - 1)}" cy="${y(ult.total)}" r="4" fill="var(--serie-a)" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<circle class="marcador" r="5" fill="var(--serie-a)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Total de participantes por dia">${g}</svg><div class="dica"></div></div>`;
}

/** Entradas para cima, saídas para baixo da linha zero. */
function graficoEntradasSaidas(serie) {
  const L = 420, A = 230, m = { t: 10, r: 8, b: 24, l: 34 };
  const max = Math.max(4, ...serie.map((s) => Math.max(s.entrou, s.saiu)));
  const zero = m.t + (A - m.t - m.b) / 2, esc2 = (A - m.t - m.b) / 2 / max;
  const w = (L - m.l - m.r) / serie.length, bw = Math.max(3, Math.min(22, w - 6));
  let g = `<line x1="${m.l}" x2="${L - m.r}" y1="${zero}" y2="${zero}" stroke="var(--mudo)" opacity=".5"/>`;
  g += `<text x="${m.l - 6}" y="${m.t + 8}" text-anchor="end">+${num(max)}</text><text x="${m.l - 6}" y="${A - m.b}" text-anchor="end">−${num(max)}</text>`;
  const cada = Math.ceil(serie.length / 6);
  serie.forEach((s, i) => {
    const x = m.l + i * w + (w - bw) / 2, he = s.entrou * esc2, hs = s.saiu * esc2;
    if (he > 0) g += `<path d="M${x},${zero - 1}V${zero - he + Math.min(3, he)}q0,-3 3,-3h${bw - 6}q3,0 3,3V${zero - 1}z" fill="var(--serie-a)"/>`;
    if (hs > 0) g += `<path d="M${x},${zero + 1}V${zero + hs - Math.min(3, hs)}q0,3 3,3h${bw - 6}q3,0 3,-3V${zero + 1}z" fill="var(--serie-b)"/>`;
    g += `<rect x="${m.l + i * w}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-dica="<b>${rotuloDia(s.dia)}</b><br>Entraram: ${num(s.entrou)}<br>Saíram: ${num(s.saiu)}"/>`;
    if (i % cada === 0) g += `<text x="${m.l + i * w + w / 2}" y="${A - 6}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
  });
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Entradas e saídas por dia">${g}</svg><div class="dica"></div></div>
    <div class="legenda"><span><i style="background:var(--serie-a)"></i>Entraram (acima)</span><span><i style="background:var(--serie-b)"></i>Saíram (abaixo)</span></div>`;
}

function ligarDicas(raiz) {
  raiz.querySelectorAll('.grafico').forEach((gr) => {
    const dica = gr.querySelector('.dica'), svg = gr.querySelector('svg'), marc = svg.querySelector('.marcador');
    gr.addEventListener('pointermove', (e) => {
      const alvo = e.target.closest('[data-dica]');
      if (!alvo) { dica.style.opacity = 0; if (marc) marc.style.display = 'none'; return; }
      dica.innerHTML = alvo.dataset.dica;
      const caixa = gr.getBoundingClientRect(), esc3 = caixa.width / svg.viewBox.baseVal.width;
      let px = e.clientX - caixa.left, py = e.clientY - caixa.top;
      if (alvo.dataset.ponto && marc) {
        const [cx, cy] = alvo.dataset.ponto.split(',').map(Number);
        marc.setAttribute('cx', cx); marc.setAttribute('cy', cy); marc.style.display = '';
        px = cx * esc3; py = cy * esc3;
      }
      dica.style.left = Math.min(caixa.width - 70, Math.max(70, px)) + 'px';
      dica.style.top = py - 6 + 'px';
      dica.style.opacity = 1;
    });
    gr.addEventListener('pointerleave', () => { dica.style.opacity = 0; if (marc) marc.style.display = 'none'; });
  });
}

        <p style="color:var(--mudo);font-size:12px;margin:8px 2px 0">Link de afiliado: <a href="${esc(o.url_afiliado)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(o.url_afiliado)}</a></p></div>

        <div class="campo"><label>Grupos (${envio.length} com envio ligado)</label>
          ${envio.length ? `<div class="lista-grupos">${envio.map((x) => `<label><input type="checkbox" value="${x.id}" checked>${esc(x.nome)}<small>${num(x.participantes)}</small></label>`).join('')}</div>`
            : `<div class="vazio" style="padding:14px;border:1px dashed var(--borda);border-radius:10px">Nenhum grupo com envio ligado. <a href="#grupos" id="ir-grupos">Ligar grupos</a></div>`}
        </div>
        <div class="campo"><label>Quando</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="segmento"><button class="ativo" data-q="agora">Agora</button><button data-q="depois">Agendar</button></div>
          <input type="datetime-local" id="quando" value="${local}" class="oculto" style="flex:1;min-width:180px"></div>
          <span class="ajuda">Os envios saem com intervalo aleatório entre os grupos, para proteger o seu número.</span></div>
        <button class="botao" id="confirmar" ${envio.length ? '' : 'disabled'}>${ico('enviar', 16)}Enviar para ${envio.length} grupo(s)</button>
      </div>
    </div></div></div>`;
  const atualizar = () => { $('#previa-txt').innerHTML = zapHtml(previaVar($('#txt').value)); $('#dica-var').classList.toggle('oculto', !temVar($('#txt').value)); };
  atualizar();
  $('#txt').oninput = atualizar;
  let depois = false;
  const rotulo = () => { const n = $('#camada').querySelectorAll('.lista-grupos input:checked').length; $('#confirmar').innerHTML = `${ico(depois ? 'agenda' : 'enviar', 16)}${depois ? 'Agendar' : 'Enviar'} para ${n} grupo(s)`; $('#confirmar').disabled = !n; };
  $('#camada').querySelectorAll('.lista-grupos input').forEach((i) => (i.onchange = rotulo));
  $('#camada').querySelectorAll('[data-q]').forEach((b) => (b.onclick = () => {
    depois = b.dataset.q === 'depois';
    $('#camada').querySelectorAll('[data-q]').forEach((x) => x.classList.toggle('ativo', x === b));
    $('#quando').classList.toggle('oculto', !depois); rotulo();
  }));
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar;
  $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  if ($('#ir-grupos')) $('#ir-grupos').onclick = fechar;
  document.addEventListener('keydown', function esc2(e) { if (e.key === 'Escape') { fechar(); document.removeEventListener('keydown', esc2); } });
  $('#confirmar').onclick = tentar(async () => {
    const grupos = [...$('#camada').querySelectorAll('.lista-grupos input:checked')].map((i) => Number(i.value));
    const quando = depois ? new Date($('#quando').value).getTime() : Date.now();
    await api('agendamentos', { method: 'POST', body: { ofertaId: o.id, texto: $('#txt').value, imagem: o.imagem, quando, grupos } });
    fechar();
    aviso(depois ? 'Oferta agendada' : 'Envio iniciado: acompanhe em Agendamentos');
    if (location.hash === '#agendamentos') telaAgendamentos(); else location.hash = '#agendamentos';
  });
  $('#txt').focus();
}

async function mostrarQr(id) {
  const caixa = $('#qr-' + id);
  if (!caixa) return;
  clearTimeout(E.timerQr);
  try {
    const r = await api(`numeros/${id}/qr`);
    if (r.estado === 'conectado') { aviso('WhatsApp conectado!'); return telaWhatsapp(); }
    caixa.innerHTML = r.qr ? `<div class="qr"><img src="${esc(r.qr)}" alt="QR Code para conectar o WhatsApp"></div><p style="text-align:center;color:var(--mudo);font-size:12.5px;margin:8px 0 0">WhatsApp &gt; Aparelhos conectados &gt; Conectar aparelho</p>`
      : '<p style="color:var(--mudo)">Gerando QR Code…</p>';
    if (location.hash === '#whatsapp') E.timerQr = setTimeout(() => mostrarQr(id), 5000);
  } catch (e) { aviso(e.message, true); }
}

  } });

  $('#modelo').oninput = previa; previa();
  $('#form-config').onsubmit = tentar(async (e) => {
    e.preventDefault();

    aviso('Configurações salvas');
    telaConfig();
  });
}

const slugDe = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); aviso('Link copiado'); }
  catch { prompt('Copie o link:', texto); }
}

    <div class="lista-grupos" style="max-height:340px">${lista.map((x) => `<label><input type="checkbox" value="${x.id}">${esc(x.nome)}<small>${num(x.participantes)} pessoas</small></label>`).join('') || '<p style="padding:10px;color:var(--mudo)">Nenhum grupo. Conecte um número em WhatsApp.</p>'}</div>
    <p style="color:var(--mudo);font-size:12.5px;margin:8px 0 14px">Ordem: <span id="ordem-g">nenhum</span></p>
    <div style="display:flex;justify-content:flex-end"><button class="botao" id="salvar-g">Salvar</button></div></div></div>`;
  const ordem = [];
  const nomeDe = (id) => lista.find((x) => String(x.id) === String(id))?.nome || id;
  $('#camada').querySelectorAll('.lista-grupos input').forEach((i) => (i.onchange = () => {
    if (i.checked) ordem.push(i.value); else ordem.splice(ordem.indexOf(i.value), 1);
    $('#ordem-g').textContent = ordem.length ? ordem.map((o, k) => `${k + 1}º ${nomeDe(o)}`).join(' · ') : 'nenhum';
  }));
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar;
  $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  $('#salvar-g').onclick = tentar(async () => { await api(`temas/${temaId}/grupos`, { method: 'POST', body: { grupos: ordem.map(Number) } }); fechar(); aviso('Grupos do tema salvos'); telaEntradas(); });
}

const ROTAS = { entradas: telaEntradas, visao: telaVisao, ofertas: telaOfertas, agendamentos: telaAgendamentos, grupos: telaGrupos, membros: telaMembros, comissoes: telaComissoes, cupons: telaCupons, whatsapp: telaWhatsapp, config: telaConfig, admin: telaAdmin };

async function navegar() {
  const tela = (location.hash.slice(1) || 'visao').split('/')[0];
  if (E.telaAtual !== tela) { E.filtroStatus = ''; E.telaAtual = tela; }
  montarMenu();
  $('#lateral').classList.remove('aberta');
  try { await (ROTAS[tela] || telaVisao)(); window.scrollTo(0, 0); }
  catch (e) { C().innerHTML = `<div class="cartao vazio"><h3>Não deu para carregar</h3>${esc(e.message)}</div>`; }
}

// Cliques gerais (chips de período, filtros, ações de ofertas e agendamentos).
document.addEventListener('click', tentar(async (e) => {
  const b = e.target.closest('button,[data-periodo]');
  if (!b) return;
  if (b.dataset.periodo) { E.periodo = b.dataset.periodo; return ROTAS[E.telaAtual]?.(); }
  if (b.dataset.filtro !== undefined) { E.filtroOfertas = b.dataset.filtro; return telaOfertas(); }
  if (b.dataset.status !== undefined) { E.filtroStatus = b.dataset.status; return telaAgendamentos(); }
  if (b.dataset.enviar) { const r = await api(`ofertas/${b.dataset.enviar}/texto`); return abrirCompositor(r.oferta, r.texto); }
  if (b.dataset.novaEntrada !== undefined) { E.novaEntrada = true; return telaEntradas(); }
  if (b.dataset.cancelarEntrada !== undefined) { E.novaEntrada = false; return telaEntradas(); }
  if (b.dataset.editarEntrada) { E.editando = E.editando === Number(b.dataset.editarEntrada) ? null : Number(b.dataset.editarEntrada); return telaEntradas(); }
  if (b.dataset.apagarEntrada) { if (!confirm('Apagar este link? Quem estiver com ele na bio vai ver "não existe".')) return; await api('entradas/' + b.dataset.apagarEntrada, { method: 'DELETE' }); E.editando = null; return telaEntradas(); }
  if (b.dataset.copiar) return copiar(b.dataset.copiar);
  if (b.dataset.escolherGrupos) return escolherGrupos(b.dataset.escolherGrupos);
  if (b.dataset.apagarTema) { await api('temas/' + b.dataset.apagarTema, { method: 'DELETE' }); return telaEntradas(); }
  if (b.dataset.convite) { await api(`grupos/${b.dataset.convite}/convite`, { method: 'POST' }); aviso('Link de convite salvo'); return telaEntradas(); }
  if (b.dataset.conviteManual) { const v = prompt('Cole o link de convite do grupo (https://chat.whatsapp.com/...)'); if (!v) return; await api(`grupos/${b.dataset.conviteManual}/ajustes`, { method: 'POST', body: { convite: v.trim() } }); aviso('Link de convite salvo'); return telaEntradas(); }
  if (b.dataset.vitrine) { await api(`ofertas/${b.dataset.vitrine}/vitrine`, { method: 'POST', body: { ligada: b.dataset.ligada === '1' } }); aviso(b.dataset.ligada === '1' ? 'Oferta na vitrine' : 'Oferta fora da vitrine'); return telaOfertas(); }
  if (b.dataset.modo) { E.lote = b.dataset.modo === 'lote'; E.resultadoLote = ''; return telaOfertas(); }
  if (b.dataset.apagar) { await api('ofertas/' + b.dataset.apagar, { method: 'DELETE' }); return telaOfertas(); }
  if (b.dataset.cancelar) { await api(`agendamentos/${b.dataset.cancelar}/cancelar`, { method: 'POST' }); aviso('Agendamento cancelado'); return telaAgendamentos(); }
}));

// Tema
const temaSalvo = (() => { try { return localStorage.getItem('ofx-tema'); } catch { return null; } })();
if (temaSalvo) document.documentElement.dataset.theme = temaSalvo;
$('#tema').onclick = () => {
  const escuro = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const novo = escuro ? 'light' : 'dark';
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem('ofx-tema', novo); } catch {}
};
$('#abrir-menu').onclick = (e) => { e.stopPropagation(); $('#lateral').classList.toggle('aberta'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#lateral')) $('#lateral').classList.remove('aberta'); });
document.addEventListener('click', (e) => { if (window.OFERTIX_MOCK && e.target.closest('[data-csv]')) { e.preventDefault(); aviso('No sistema real, este botão baixa uma planilha CSV para o Excel.'); } });
document.addEventListener('click', (e) => { if (window.OFERTIX_MOCK && e.target.closest('[data-ver-pagina]')) { e.preventDefault(); aviso('No sistema real, abre a página pública do link (ofertix.mssolucoestech.com.br/g/...).'); } });
$('#form-colar').onsubmit = tentar(async (e) => { e.preventDefault(); await gerarOferta($('#link-topo').value); $('#link-topo').value = ''; });
window.addEventListener('hashchange', navegar);

(async () => {
  try {
    E.eu = await api('eu');
  } catch (e) { C().innerHTML = `<div class="cartao vazio"><h3>Sessão expirada</h3>Abra o Ofertix pela área do cliente.</div>`; return; }
  $('#nome-conta').textContent = E.eu.nome || E.eu.email;
  $('#selo-plano').textContent = E.eu.plano.nome;
  $('#avatar').textContent = (E.eu.nome || E.eu.email || 'O').trim()[0].toUpperCase();
  $('#sair').href = window.OFERTIX_MOCK ? '#visao' : '/sair';
  if (E.eu.demo) $('#aviso-demo').classList.remove('oculto');
  if (E.eu.leitura) $('#aviso-demo').classList.remove('oculto'), ($('#aviso-demo span').textContent = 'Seu acesso é só de leitura.');
  navegar();
})();
</script>
