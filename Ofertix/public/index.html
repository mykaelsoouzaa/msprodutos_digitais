          </div>
          <div class="campo" style="margin-top:14px"><label for="ee-desc-${e.id}">Frase da página</label><input id="ee-desc-${e.id}" name="descricao" value="${esc(e.descricao)}" maxlength="240"></div>
          <div class="linha-inter"><div><b>Avisar que os links são de afiliado</b><div style="color:var(--mudo);font-size:13px">Recomendado: deixa claro para o público e segue as regras de publicidade.</div></div><label class="inter"><input type="checkbox" name="aviso_afiliado" ${e.aviso_afiliado ? 'checked' : ''} aria-label="Avisar links de afiliado"><span></span></label></div>
          <div class="linha-inter"><div><b>Página no ar</b></div><label class="inter"><input type="checkbox" name="ativo" ${e.ativo ? 'checked' : ''} aria-label="Página no ar"><span></span></label></div>
          <div style="display:flex;justify-content:space-between;gap:8px;margin-top:8px"><button class="botao perigo peq" type="button" data-apagar-entrada="${e.id}">Apagar link</button><button class="botao" type="submit">Salvar</button></div>
        </form>` : ''}
        <div class="kpis" style="margin:18px 0 6px">
          ${kpi('pessoas', num(e.visitas), 'Visitas na página')}
          ${kpi('clique', num(e.cliques), `Foram para um grupo · ${pct(e.cliques, e.visitas)}%`)}
          ${kpi('sobe', num(e.entraram), 'Entraram nos grupos (todas as origens)')}
          ${kpi('alerta', num(e.lotados), 'Acharam o tema lotado', e.lotados ? 'v' : 'a')}
        </div>
        <div class="grade-2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);margin-top:14px">
          <div><h3 style="font-size:15px;margin-bottom:8px">Temas e grupos</h3>
            ${e.temas.map((t) => `<div class="tema-adm" style="border:1px solid var(--borda);border-radius:12px;padding:12px 14px;margin-bottom:10px">
              <div style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap"><b>${esc(t.emoji || '🛍️')} ${esc(t.nome)}</b><span style="color:var(--mudo);font-size:12.5px">${num(t.cliques)} cliques no período</span></div>
              ${t.grupos.length ? t.grupos.map((gr) => {
                const cheio = gr.participantes >= gr.limite, p = Math.min(100, pct(gr.participantes, gr.limite));
                return `<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap"><span>${esc(gr.nome)} ${t.ativo === gr.id ? '<span class="status ativo">recebendo agora</span>' : cheio ? '<span class="status erro">lotado</span>' : ''}</span>
                  <span style="color:var(--mudo)">${num(gr.participantes)}/${num(gr.limite)}</span></div>
                  <div class="rank" style="padding:4px 0 0;border:0"><div class="meio"><div class="barra"><i style="width:${p}%;background:${cheio ? 'var(--vermelho)' : p > 90 ? 'var(--amarelo)' : 'var(--serie-a)'}"></i></div></div></div>
                  ${gr.tem_convite ? '' : `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center"><span style="font-size:12.5px;color:var(--amarelo)">Sem link de convite</span><button class="botao sec peq" data-convite="${gr.id}">Pegar do WhatsApp</button><button class="botao sec peq" data-convite-manual="${gr.id}">Colar link</button></div>`}</div>`;
              }).join('') : '<p style="color:var(--mudo);font-size:13px;margin-top:8px">Nenhum grupo ainda.</p>'}
              <div style="display:flex;gap:6px;margin-top:12px"><button class="botao sec peq" data-escolher-grupos="${t.id}">Escolher grupos</button><button class="botao sec peq" data-apagar-tema="${t.id}" aria-label="Apagar tema">${ico('lixo', 14)}</button></div>
            </div>`).join('')}
            <form class="form-tema" data-id="${e.id}" style="display:flex;gap:6px;flex-wrap:wrap"><input name="emoji" placeholder="💄" maxlength="8" style="width:58px;text-align:center" class="campo-mini" aria-label="Emoji do tema"><input name="nome" placeholder="Novo tema (ex.: Casa e cozinha)" maxlength="40" class="campo-mini" style="flex:1;min-width:160px" aria-label="Nome do tema"><button class="botao sec peq" type="submit">${ico('mais', 14)}Adicionar tema</button></form>
          </div>
          <div><h3 style="font-size:15px;margin-bottom:8px">De onde vêm</h3>
            ${e.origens.length ? `<table class="tabela"><thead><tr><th>Origem</th><th class="num">Visitas</th><th class="num">Grupo</th></tr></thead><tbody>${e.origens.map((o) => `<tr><td>${esc(o.origem)}</td><td class="num">${num(o.visitas)}</td><td class="num">${num(o.cliques)}</td></tr>`).join('')}</tbody></table>`
              : '<p style="color:var(--mudo);font-size:13px">Ainda sem visitas no período.</p>'}
            <h3 style="font-size:15px;margin:16px 0 6px">Um link para cada lugar</h3>
            <p style="color:var(--mudo);font-size:12.5px;margin:0 0 8px">Use um em cada post para saber o que traz mais gente.</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap">${ORIGENS.map(([o, n]) => `<button class="chip" data-copiar="${esc(url)}?o=${o}">${n}</button>`).join('')}</div>
          </div>
        </div>
      </section>`;
    }).join('')}`;
  const f = $('#form-entrada');
  if (f) {
    let mexeu = false;
    const ver = () => ($('#e-slug-ver').textContent = $('#e-slug').value || '…');
    $('#e-tit').oninput = () => { if (!mexeu) $('#e-slug').value = slugDe($('#e-tit').value); ver(); };
    $('#e-slug').oninput = () => { mexeu = true; $('#e-slug').value = slugDe($('#e-slug').value); ver(); };
    f.onsubmit = tentar(async (ev) => {
      ev.preventDefault();
      await api('entradas', { method: 'POST', body: { titulo: $('#e-tit').value, slug: $('#e-slug').value, cor: $('#e-cor').value, descricao: $('#e-desc').value } });
      E.novaEntrada = false; aviso('Link criado. Agora adicione os temas e os grupos.'); telaEntradas();
    });
  }
  C().querySelectorAll('.form-tema').forEach((ft) => (ft.onsubmit = tentar(async (ev) => {
    ev.preventDefault();
    await api(`entradas/${ft.dataset.id}/temas`, { method: 'POST', body: { nome: ft.nome.value, emoji: ft.emoji.value } });
    telaEntradas();
  })));
  C().querySelectorAll('.form-entrada-edit').forEach((fe) => (fe.onsubmit = tentar(async (ev) => {
    ev.preventDefault();
    await api('entradas/' + fe.dataset.id, { method: 'POST', body: { titulo: fe.titulo.value, cor: fe.cor.value, foto: fe.foto.value, descricao: fe.descricao.value, aviso_afiliado: fe.aviso_afiliado.checked, ativo: fe.ativo.checked } });
    E.editando = null; aviso('Página salva'); telaEntradas();
  })));
}

function escolherGrupos(temaId) {
  const entradas = $('#conteudo');
  const atuais = [...entradas.querySelectorAll(`[data-escolher-grupos="${temaId}"]`)][0]?.closest('.tema-adm');
  const lista = E.gruposTodos || [];
  $('#camada').innerHTML = `<div class="fundo" id="fundo"><div class="cartao modal" role="dialog" aria-modal="true" aria-labelledby="tit-g" style="width:min(560px,100%)">
    <div class="modal-cab"><h2 id="tit-g">Grupos deste tema</h2><button class="icone-btn" id="fechar" aria-label="Fechar">${ico('x')}</button></div>
    <p style="color:var(--texto-2);margin:0 0 12px">Marque na ordem em que eles devem lotar: o primeiro recebe as pessoas até encher, depois o segundo, e assim por diante. O número conectado precisa ser administrador de cada grupo.</p>
    <div class="lista-grupos" style="max-height:340px">${lista.map((x) => `<label><input type="checkbox" value="${x.id}">${esc(x.nome)}<small>${num(x.participantes)} pessoas</small></label>`).join('') || '<p style="padding:10px;color:var(--mudo)">Nenhum grupo. Conecte um número em WhatsApp.</p>'}</div>
    <p style="color:var(--mudo);font-size:12.5px;margin:8px 0 14px">Ordem: <span id="ordem-g">nenhum</span></p>
    <div style="display:flex;justify-content:flex-end"><button class="botao" id="salvar-g">Salvar</button></div></div></div>`;
  const ordem = [];
  const nomeDe = (id) => lista.find((x) => String(x.id) === String(id))?.nome || id;
  $('#camada').querySelectorAll('.lista-grupos input').forEach((i) => (i.onchange = () => {
    if (i.checked) ordem.push(i.value); else ordem.splice(ordem.indexOf(i.value), 1);
    $('#ordem-g').textContent = ordem.length ? ordem.map((o, k) => `${k + 1}º ${nomeDe(o)}`).join(' · ') : 'nenhum';
  }));
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar;
  $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  $('#salvar-g').onclick = tentar(async () => { await api(`temas/${temaId}/grupos`, { method: 'POST', body: { grupos: ordem.map(Number) } }); fechar(); aviso('Grupos do tema salvos'); telaEntradas(); });
}

const ROTAS = { automaticas: telaAutomaticas, nicho: telaNicho, entradas: telaEntradas, visao: telaVisao, ofertas: telaOfertas, agendamentos: telaAgendamentos, grupos: telaGrupos, membros: telaMembros, comissoes: telaComissoes, cupons: telaCupons, whatsapp: telaWhatsapp, config: telaConfig, admin: telaAdmin };

async function navegar() {
  const tela = (location.hash.slice(1) || 'visao').split('/')[0];
  if (E.telaAtual !== tela) { E.filtroStatus = ''; E.telaAtual = tela; }
  montarMenu();
  $('#lateral').classList.remove('aberta');
  $('#camada').innerHTML = ''; // janela aberta não fica por cima da tela nova
  try { await (ROTAS[tela] || telaVisao)(); window.scrollTo(0, 0); }
  catch (e) { C().innerHTML = `<div class="cartao vazio"><h3>Não deu para carregar</h3>${esc(e.message)}</div>`; }
}

// Cliques gerais (chips de período, filtros, ações de ofertas e agendamentos).
document.addEventListener('click', tentar(async (e) => {
  const b = e.target.closest('button,[data-periodo]');
  if (!b) return;
  if (b.dataset.periodo) { E.periodo = b.dataset.periodo; return ROTAS[E.telaAtual]?.(); }
  if (b.dataset.filtro !== undefined) { E.filtroOfertas = b.dataset.filtro; return telaOfertas(); }
  if (b.dataset.status !== undefined) { E.filtroStatus = b.dataset.status; return telaAgendamentos(); }
  if (b.dataset.enviar) { const r = await api(`ofertas/${b.dataset.enviar}/texto`); return abrirCompositor(r.oferta, r.texto); }
  if (b.dataset.novaEntrada !== undefined) { E.novaEntrada = true; return telaEntradas(); }
  if (b.dataset.cancelarEntrada !== undefined) { E.novaEntrada = false; return telaEntradas(); }
  if (b.dataset.editarEntrada) { E.editando = E.editando === Number(b.dataset.editarEntrada) ? null : Number(b.dataset.editarEntrada); return telaEntradas(); }
  if (b.dataset.apagarEntrada) { if (!confirm('Apagar este link? Quem estiver com ele na bio vai ver "não existe".')) return; await api('entradas/' + b.dataset.apagarEntrada, { method: 'DELETE' }); E.editando = null; return telaEntradas(); }
  if (b.dataset.copiar) return copiar(b.dataset.copiar);
  if (b.dataset.escolherGrupos) return escolherGrupos(b.dataset.escolherGrupos);
  if (b.dataset.apagarTema) { await api('temas/' + b.dataset.apagarTema, { method: 'DELETE' }); return telaEntradas(); }
  if (b.dataset.convite) { await api(`grupos/${b.dataset.convite}/convite`, { method: 'POST' }); aviso('Link de convite salvo'); return telaEntradas(); }
  if (b.dataset.conviteManual) { const v = prompt('Cole o link de convite do grupo (https://chat.whatsapp.com/...)'); if (!v) return; await api(`grupos/${b.dataset.conviteManual}/ajustes`, { method: 'POST', body: { convite: v.trim() } }); aviso('Link de convite salvo'); return telaEntradas(); }
  if (b.dataset.vitrine) { await api(`ofertas/${b.dataset.vitrine}/vitrine`, { method: 'POST', body: { ligada: b.dataset.ligada === '1' } }); aviso(b.dataset.ligada === '1' ? 'Oferta na vitrine' : 'Oferta fora da vitrine'); return telaOfertas(); }
  if (b.dataset.modo) { E.lote = b.dataset.modo === 'lote'; E.buscaShopee = b.dataset.modo === 'busca'; E.resultadoLote = ''; return telaOfertas(); }
  if (b.dataset.apagar) { await api('ofertas/' + b.dataset.apagar, { method: 'DELETE' }); return telaOfertas(); }
  if (b.dataset.repetir) return enviarDeNovo(b.dataset.repetir);
  if (b.dataset.cancelar) { await api(`agendamentos/${b.dataset.cancelar}/cancelar`, { method: 'POST' }); aviso('Agendamento cancelado'); return telaAgendamentos(); }
}));

// Tema
const temaSalvo = (() => { try { return localStorage.getItem('ofx-tema'); } catch { return null; } })();
if (temaSalvo) document.documentElement.dataset.theme = temaSalvo;
$('#tema').onclick = () => {
  const escuro = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const novo = escuro ? 'light' : 'dark';
  document.documentElement.dataset.theme = novo;
  try { localStorage.setItem('ofx-tema', novo); } catch {}
};
function desenharPausa() {
  const b = $('#pausa'), p = !!E.eu?.pausado;
  b.innerHTML = ico(p ? 'play' : 'pausa', 18); b.classList.toggle('pausado-btn', p);
  b.title = p ? 'Envios pausados: clique para retomar' : 'Pausar todos os envios'; b.setAttribute('aria-label', b.title);
}
$('#pausa').onclick = tentar(async () => {
  const p = !E.eu?.pausado;
  if (p && !confirm('Pausar todos os envios? Nada sai (ofertas, vitrine, recorrentes e boas-vindas) até você retomar.')) return;
  await api('pausa', { method: 'POST', body: { pausado: p } });
  E.eu.pausado = p; desenharPausa(); aviso(p ? 'Envios pausados' : 'Envios retomados'); navegar();
});
if ('serviceWorker' in navigator && !window.OFERTIX_MOCK) navigator.serviceWorker.register('/sw.js').catch(() => {});
$('#abrir-menu').onclick = (e) => { e.stopPropagation(); $('#lateral').classList.toggle('aberta'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#lateral')) $('#lateral').classList.remove('aberta'); });
document.addEventListener('click', (e) => { if (window.OFERTIX_MOCK && e.target.closest('[data-csv]')) { e.preventDefault(); aviso('No sistema real, este botão baixa uma planilha CSV para o Excel.'); } });
document.addEventListener('click', (e) => { if (window.OFERTIX_MOCK && e.target.closest('[data-ver-pagina]')) { e.preventDefault(); aviso('No sistema real, abre a página pública do link (ofertix.mssolucoestech.com.br/g/...).'); } });
$('#form-colar').onsubmit = tentar(async (e) => { e.preventDefault(); await gerarOferta($('#link-topo').value); $('#link-topo').value = ''; });
window.addEventListener('hashchange', navegar);

(async () => {
  try {
    E.eu = await api('eu');
  } catch (e) { C().innerHTML = `<div class="cartao vazio"><h3>Sessão expirada</h3>Abra o Ofertix pela área do cliente.</div>`; return; }
  $('#nome-conta').textContent = E.eu.nome || E.eu.email;
  $('#selo-plano').textContent = E.eu.plano.nome;
  $('#avatar').textContent = (E.eu.nome || E.eu.email || 'O').trim()[0].toUpperCase();
  $('#sair').href = window.OFERTIX_MOCK ? '#visao' : '/sair';
  if (E.eu.demo) $('#aviso-demo').classList.remove('oculto');
  desenharPausa();
  if (E.eu.leitura) $('#aviso-demo').classList.remove('oculto'), ($('#aviso-demo span').textContent = 'Seu acesso é só de leitura.');
  navegar();
})();
</script>
</body>
</html>
