<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofertix</title>
<link rel="icon" type="image/png" href="/assets/logo-128.png"><link rel="apple-touch-icon" href="/assets/logo-256.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#E8355A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f5;--surface:#ffffff;--surface-2:#eef3f0;--borda:#dbe4de;--texto:#0f1a14;--texto-2:#4a5a51;--mudo:#7a8a81;
  --verde:#0c9f5f;--verde-forte:#08824d;--verde-suave:#dff6ea;--laranja:#d9601a;--laranja-suave:#fde9dc;--vermelho:#c9302c;--vermelho-suave:#fbe3e2;--amarelo:#a66a00;--amarelo-suave:#fff1d1;
  --serie-a:#0FA968;--serie-b:#E86A1A;--sobre-verde:#ffffff;--grade:#e6ece8;--sombra:0 1px 2px rgba(15,26,20,.06),0 8px 24px rgba(15,26,20,.06);
  --raio:14px;--fonte-titulo:'Space Grotesk',system-ui,sans-serif;--fonte:'Inter',system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0b0f0d;--surface:#121815;--surface-2:#171f1b;--borda:#212c26;--texto:#e7efe9;--texto-2:#a3b3a9;--mudo:#6f8076;
  --verde:#2ee68f;--verde-forte:#22c97a;--verde-suave:rgba(46,230,143,.12);--laranja:#ff9a55;--laranja-suave:rgba(255,138,61,.14);--vermelho:#ff6b66;--vermelho-suave:rgba(255,107,102,.13);--amarelo:#f5c04a;--amarelo-suave:rgba(245,192,74,.13);
  --serie-a:#12A862;--serie-b:#E0641C;--sobre-verde:#062012;--grade:#1c2621;--sombra:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0f0d;--surface:#121815;--surface-2:#171f1b;--borda:#212c26;--texto:#e7efe9;--texto-2:#a3b3a9;--mudo:#6f8076;
    --verde:#2ee68f;--verde-forte:#22c97a;--verde-suave:rgba(46,230,143,.12);--laranja:#ff9a55;--laranja-suave:rgba(255,138,61,.14);--vermelho:#ff6b66;--vermelho-suave:rgba(255,107,102,.13);--amarelo:#f5c04a;--amarelo-suave:rgba(245,192,74,.13);
    --serie-a:#12A862;--serie-b:#E0641C;--sobre-verde:#062012;--grade:#1c2621;--sombra:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--texto);font:14px/1.45 var(--fonte);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--verde)}
h1,h2,h3{font-family:var(--fonte-titulo);letter-spacing:-.01em;margin:0}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* Menu lateral */
.lateral{background:var(--surface);border-right:1px solid var(--borda);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:700 22px var(--fonte-titulo);letter-spacing:-.02em}
.marca svg{flex:none}
.marca b{color:var(--verde)}
.grupo-menu{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mudo);padding:14px 12px 6px}
.item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--texto-2);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.item:hover{background:var(--surface-2);color:var(--texto)}
.item.ativo{background:var(--verde-suave);color:var(--verde);font-weight:600}
.item svg{width:18px;height:18px;flex:none}
.item .cont{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--texto-2);border-radius:99px;padding:1px 8px}
.rodape-menu{margin-top:auto;padding:12px;border-top:1px solid var(--borda);display:flex;flex-direction:column;gap:8px}
.plano{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--texto-2)}
.selo{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--verde-suave);color:var(--verde)}
/* Topo */
.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda);padding:12px 28px;display:flex;align-items:center;gap:12px}
.colar{flex:1;min-width:0;max-width:640px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--borda);border-radius:12px;padding:0 6px 0 12px;height:42px}
.colar:focus-within{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-suave)}
.colar input{flex:1;border:0;background:none;outline:none;min-width:0;height:100%}
.colar svg{color:var(--mudo);flex:none}
.icone-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--borda);background:var(--surface);cursor:pointer;color:var(--texto-2);flex:none}
.icone-btn:hover{color:var(--texto)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--verde);color:var(--sobre-verde);font-weight:700;flex:none}
.so-celular{display:none}
.conteudo{padding:26px 28px 60px;max-width:1240px;width:100%}
.aviso-demo{margin:14px 28px 0;padding:10px 14px;border-radius:12px;background:var(--amarelo-suave);color:var(--amarelo);font-size:13px;display:flex;gap:10px;align-items:center}
/* Blocos */
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cabeca h1{font-size:26px;display:flex;align-items:center;gap:10px}
.cabeca h1 svg{color:var(--verde)}
.cabeca p{margin:4px 0 0;color:var(--texto-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--borda);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--texto-2)}
.chip:hover{color:var(--texto)}
.chip.ativo{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde);font-weight:600}
.cartao{background:var(--surface);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.kpi .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--verde-suave);color:var(--verde)}
.kpi .ico.l{background:var(--laranja-suave);color:var(--laranja)}
.kpi .ico.a{background:var(--amarelo-suave);color:var(--amarelo)}
.kpi .ico.v{background:var(--vermelho-suave);color:var(--vermelho)}
.kpi .valor{font:700 28px/1 var(--fonte-titulo);letter-spacing:-.02em}
.kpi .valor small{font-size:15px;color:var(--mudo);font-weight:500}
.kpi .rot{color:var(--texto-2);font-size:13px}
.grade-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.bloco{padding:18px 20px}
.bloco h2{font-size:16px;margin-bottom:2px}
.bloco .sub{color:var(--mudo);font-size:12.5px;margin:0 0 14px}
.botao{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--verde);color:var(--sobre-verde);white-space:nowrap}
.botao:hover{background:var(--verde-forte)}
.botao{text-decoration:none}
.botao.sec{background:var(--surface);border-color:var(--borda);color:var(--texto)}
.botao.sec:hover{background:var(--surface-2)}
.botao.perigo{background:var(--vermelho-suave);color:var(--vermelho)}
.botao.peq{padding:6px 11px;font-size:13px}
.botao:disabled{opacity:.55;cursor:not-allowed}
/* Gráficos */
.grafico{position:relative}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico text{fill:var(--mudo);font-size:11px;font-family:var(--fonte)}
.dica{position:absolute;pointer-events:none;background:var(--texto);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s;z-index:3}
.dica b{font-weight:600}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--texto-2);margin-top:8px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* Listas */
.linhas{display:flex;flex-direction:column}
.linha{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--borda)}
.linha:first-child{border-top:0}
.miniatura{width:46px;height:46px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.miniatura img{width:100%;height:100%;object-fit:cover}
.linha .meio{flex:1;min-width:0}
.linha .tit{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .det{color:var(--mudo);font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.loja{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em}
.loja.shopee{background:#ee4d2d;color:#fff}.loja.mercadolivre{background:#ffe600;color:#2d3277}.loja.amazon{background:#232f3e;color:#ff9900}.loja.magalu{background:#0086ff;color:#fff}.loja.outra{background:var(--surface-2);color:var(--texto-2)}
.status{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.pendente{background:var(--amarelo-suave);color:var(--amarelo)}
.status.enviando{background:var(--verde-suave);color:var(--verde)}
.status.enviado,.status.conectado,.status.concluido,.status.ativo{background:var(--verde-suave);color:var(--verde)}
.status.erro,.status.desconectado,.status.cancelado{background:var(--vermelho-suave);color:var(--vermelho)}
.status.conectando{background:var(--amarelo-suave);color:var(--amarelo)}
/* Ofertas */
.grade-ofertas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.oferta{display:flex;flex-direction:column;overflow:hidden}
.oferta .foto{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;font-size:64px;position:relative}
.oferta .foto img{width:100%;height:100%;object-fit:cover}
.oferta .foto .loja{position:absolute;left:10px;bottom:10px}
.oferta .foto .off{position:absolute;right:10px;top:10px;background:var(--laranja);color:#fff;font:700 12px var(--fonte-titulo);padding:3px 8px;border-radius:6px}
.oferta .foto .capt{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--texto-2);font-size:11px;padding:3px 8px;border-radius:6px}
.oferta .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.oferta .nome{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.precos{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.precos s{color:var(--mudo);font-size:12px}
.precos b{font:700 18px var(--fonte-titulo);color:var(--verde)}
.comissao{font-size:12px;color:var(--texto-2)}
.oferta .acoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.oferta .acoes .botao{flex:1}
.vazio{padding:40px 20px;text-align:center;color:var(--mudo)}
.vazio svg{color:var(--verde);margin-bottom:10px}
.vazio h3{color:var(--texto);margin-bottom:6px}
.colar-grande{display:flex;gap:8px;padding:16px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.colar-grande .campo{flex:1;min-width:220px}
/* Tabelas */
.tabela{width:100%;border-collapse:collapse}
.tabela th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mudo);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--borda)}
.tabela td{padding:11px 12px;border-bottom:1px solid var(--borda)}
.tabela tr:last-child td{border-bottom:0}
.tabela .num{text-align:right;font-variant-numeric:tabular-nums}
.rolagem{overflow-x:auto}
/* Interruptor */
.inter{position:relative;width:40px;height:23px;flex:none;display:inline-block}
.inter input{opacity:0;width:0;height:0;position:absolute}
.inter span{position:absolute;inset:0;border-radius:99px;background:var(--borda);transition:.15s;cursor:pointer}
.inter span::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.inter input:checked+span{background:var(--verde)}
.inter input:checked+span::after{transform:translateX(17px)}
.inter input:focus-visible+span{outline:2px solid var(--verde);outline-offset:2px}
.inter input:disabled+span{opacity:.5;cursor:not-allowed}
/* Formulários */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12.5px;font-weight:600;color:var(--texto-2)}
.campo input,.campo select,.campo textarea{background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-suave)}
.campo textarea{resize:vertical;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.campo .ajuda{font-size:12px;color:var(--mudo)}
.form-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.secao-form{padding:20px;margin-bottom:16px}
.secao-form h2{font-size:16px;margin-bottom:4px}
.secao-form>p{color:var(--mudo);margin:0 0 16px;font-size:13px}
.linha-inter{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}
/* WhatsApp prévia */
.zap{background:#0b141a;border-radius:14px;padding:16px;background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px}
.bolha{background:#005c4b;color:#e9edef;border-radius:10px 10px 2px 10px;padding:6px 8px 18px;max-width:330px;margin-left:auto;position:relative;font-size:13.5px;white-space:pre-wrap;word-break:break-word;font-family:var(--fonte)}
.bolha .img{max-height:210px;border-radius:8px;background:#0a3b31;display:grid;place-items:center;font-size:72px;aspect-ratio:4/3;margin-bottom:6px;overflow:hidden}
.bolha .img img{width:100%;height:100%;object-fit:cover}
.bolha .hora{position:absolute;right:8px;bottom:4px;font-size:10.5px;color:#9fc6bd}
.bolha s{opacity:.75}
/* Modal */
.fundo{position:fixed;inset:0;background:rgba(5,10,7,.6);z-index:20;display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.modal{width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px}
.modal-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.modal-cab h2{font-size:19px}
.modal-corpo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.lista-grupos{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--borda);border-radius:10px;padding:6px}
.lista-grupos label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.lista-grupos label:hover{background:var(--surface-2)}
.lista-grupos input{accent-color:var(--verde);width:16px;height:16px}
.lista-grupos small{margin-left:auto;color:var(--mudo)}
.segmento{display:inline-flex;background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:3px}
.segmento button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--texto-2);font-size:13px}
.segmento button.ativo{background:var(--surface);color:var(--texto);font-weight:600;box-shadow:var(--sombra)}
/* Números */
.numeros{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.numero{padding:18px;display:flex;flex-direction:column;gap:12px}
.numero .topo-n{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qr{background:#fff;border-radius:12px;padding:10px;display:grid;place-items:center;aspect-ratio:1;max-width:240px;margin:0 auto;width:100%}
.qr img{width:100%;height:auto}
.dicas-ban{padding:18px 20px;margin-top:16px}
.dicas-ban ul{margin:8px 0 0;padding-left:18px;color:var(--texto-2)}
.dicas-ban li{margin:4px 0}
/* Avisos */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--texto);color:var(--bg);padding:11px 16px;border-radius:10px;z-index:40;font-weight:500;box-shadow:var(--sombra);max-width:calc(100vw - 32px)}
.toast.erro{background:var(--vermelho);color:#fff}
.carregando{color:var(--mudo);padding:30px;text-align:center}
.avisos{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alerta{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:13.5px;text-decoration:none;border:1px solid transparent}
.alerta svg{flex:none}
.alerta.erro{background:var(--vermelho-suave);color:var(--vermelho)}
.alerta.atencao{background:var(--amarelo-suave);color:var(--amarelo)}
.alerta.info{background:var(--surface);border-color:var(--borda);color:var(--texto-2)}
.alerta span{flex:1;min-width:0}
.alerta b{font-weight:600;white-space:nowrap}
.rank{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--borda)}
.rank:first-child{border-top:0}
.rank .pos{width:22px;font:700 13px var(--fonte-titulo);color:var(--mudo);text-align:center;flex:none}
.rank .meio{flex:1;min-width:0}
.rank .barra{height:4px;border-radius:4px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.rank .barra i{display:block;height:100%;border-radius:4px;background:var(--serie-a)}
.rank .val{text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rank .val b{font:700 15px var(--fonte-titulo)}
.rank .val small{display:block;color:var(--mudo);font-size:11.5px}
.oferta .foto .esg{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font:700 14px var(--fonte-titulo);letter-spacing:.06em;text-transform:uppercase}
.oferta .foto .vit{position:absolute;right:10px;bottom:10px;background:var(--verde);color:var(--sobre-verde);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.metricas{display:flex;gap:10px;font-size:12px;color:var(--texto-2);flex-wrap:wrap}
.botao.estrela.ativa{background:var(--verde-suave);color:var(--verde);border-color:transparent}
.motivo{color:var(--texto-2);font-size:12.5px;margin-top:3px}
.tag-origem{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em}
.lote textarea{min-height:130px}
.resultado-lote{margin:-6px 0 16px;padding:12px 16px;font-size:13px}
.resultado-lote li{margin:3px 0}
.campo-mini{background:var(--surface-2);border:1px solid var(--borda);border-radius:10px;padding:7px 10px;outline:none}
.campo-mini:focus{border-color:var(--verde)}
.dica-var{font-size:12px;color:var(--verde);background:var(--verde-suave);border-radius:8px;padding:6px 10px}
.oculto{display:none!important}
.fora-nicho{opacity:.62}.fora-nicho:hover{opacity:1}

<script>
'use strict';
// ------------------------------------------------------------------ utilidades
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reais = (c) => c == null ? '—' : 'R$ ' + (c / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const reaisCurto = (c) => 'R$ ' + (c / 100).toLocaleString('pt-BR', { maximumFractionDigits: 0 });
const num = (n) => Number(n || 0).toLocaleString('pt-BR');
const pct = (de, por) => (de && por && de > por ? Math.round((1 - por / de) * 100) : 0);
const LOJAS = { shopee: 'Shopee', mercadolivre: 'Mercado Livre', amazon: 'Amazon', magalu: 'Magalu', outra: 'Loja' };
const loja = (p) => `<span class="loja ${esc(p || 'outra')}">${esc(LOJAS[p] || 'Loja')}</span>`;
const hora = (ms) => new Date(ms).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const quandoTxt = (ms) => {
  const d = new Date(ms), hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dif = Math.floor((new Date(d).setHours(0, 0, 0, 0) - hoje) / 864e5);
  const dia = dif === 0 ? 'hoje' : dif === 1 ? 'amanhã' : dif === -1 ? 'ontem' : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  return `${dia}, ${hora(ms)}`;
};
const foto = (img, cls = '') => img && /^https?:/.test(img)
  ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('🛍️'))">`
  : esc(String(img || '').startsWith('emoji:') ? img.slice(6) : '🛍️');
const STATUS = { pendente: 'Pendente', enviando: 'Enviando', enviado: 'Enviado', erro: 'Erro', cancelado: 'Cancelado', conectado: 'Conectado', conectando: 'Conectando', desconectado: 'Desconectado', concluido: 'Concluído', ativo: 'Ativo' };
const status = (s) => `<span class="status ${esc(s)}">${esc(STATUS[s] || s)}</span>`;

function aviso(msg, erro = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : '');
  t.textContent = msg;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

async function api(caminho, opts = {}) {
  const metodo = opts.method || 'GET';
  if (window.OFERTIX_MOCK) return window.OFERTIX_MOCK(metodo, caminho, opts.body);
  const r = await fetch('/api/' + caminho, {
    method: metodo, credentials: 'same-origin',
    headers: { 'content-type': 'application/json', 'x-ofertix': '1' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/'; throw new Error(j.erro); }
  if (!r.ok) throw new Error(j.erro || 'Algo deu errado');
  return j;
}
const tentar = (fn) => async (...a) => { try { await fn(...a); } catch (e) { aviso(e.message, true); } };
// Opções da v5 ficam juntas: lê as atuais, troca só o que mudou e salva tudo.
async function salvarExtras(parcial) { const atual = await api('extras'); return api('extras', { method: 'POST', body: { ...atual, ...parcial } }); }

// ------------------------------------------------------------------ ícones
const I = {
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',

  membros: '<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',
  comissoes: '<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',

  whatsapp: '<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  admin: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cel: '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  relogio: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  ima: '<path d="M6 15V9a6 6 0 0 1 12 0v6M6 15H2v-6M18 15h4v-6M6 19h4M14 19h4"/>',
  enviar: '<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
  sync: '<path d="M21 12a9 9 0 0 1-15 6.7L3 16M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M3 21v-5h5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  pausa: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  editar: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/>',
  arquivo: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>',
  raio: '<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',

  sacola: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',

const ico = (n, t = 18) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

// ------------------------------------------------------------------ estado e menu
const E = { eu: null, periodo: '7d', filtroOfertas: '', filtroCat: '', filtroStatus: '', grupoMembros: '' };
const TELAS = [
  ['visao', 'Visão geral', 'Painel'], ['ofertas', 'Ofertas'], ['agendamentos', 'Agendamentos', null, 'agenda'],
  ['grupos', 'Grupos de envio', 'Grupos'], ['entradas', 'Links de entrada', null, 'link'], ['automaticas', 'Mensagens automáticas', null, 'raio'], ['membros', 'Membros'],
  ['comissoes', 'Comissões', 'Resultados'], ['cupons', 'Cupons'],
  ['nicho', 'Nicho e curadoria', 'Conta', 'estrela'], ['whatsapp', 'WhatsApp'], ['config', 'Configurações'],
];

function montarMenu() {
  const atual = (location.hash.slice(1) || 'visao').split('/')[0];
  let h = '';
  for (const [id, nome, grupo, icn] of TELAS) {
    if (grupo) h += `<div class="grupo-menu">${grupo}</div>`;
    h += `<a class="item ${atual === id ? 'ativo' : ''}" href="#${id}">${ico(icn || id)}${nome}${id === 'agendamentos' && E.pendentes ? `<span class="cont">${E.pendentes}</span>` : ''}</a>`;
  }
  if (E.eu?.admin) h += `<div class="grupo-menu">MS Soluções</div><a class="item ${atual === 'admin' ? 'ativo' : ''}" href="#admin">${ico('admin')}Administração</a>`;
  $('#menu').innerHTML = h;
}

const chipsPeriodo = (opcoes = ['hoje', 'ontem', '7d', '30d', 'mes', 'mes-anterior']) => {
  const nomes = { hoje: 'Hoje', ontem: 'Ontem', '7d': 'Últimos 7 dias', '30d': 'Últimos 30 dias', mes: 'Mês atual', 'mes-anterior': 'Mês anterior' };
  return `<div class="chips" role="group" aria-label="Período">${opcoes.map((p) => `<button class="chip ${E.periodo === p ? 'ativo' : ''}" data-periodo="${p}">${nomes[p]}</button>`).join('')}</div>`;
};

const kpi = (icone, valor, rotulo, cor = '') => `<div class="cartao kpi"><div class="ico ${cor}">${ico(icone, 17)}</div><div class="valor">${valor}</div><div class="rot">${rotulo}</div></div>`;
const cabeca = (icone, titulo, sub, direita = '') => `<div class="cabeca"><div><h1>${ico(icone, 24)}${titulo}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${direita}</div>`;

// ------------------------------------------------------------------ gráficos (SVG)
const rotuloDia = (d) => { const [, m, dd] = d.split('-'); return `${dd}/${m}`; };

/** Barras de uma série (envios por dia). */
function graficoBarras(serie, chave, nome) {
  const L = 640, A = 220, m = { t: 12, r: 8, b: 26, l: 34 };
  const max = Math.max(4, ...serie.map((s) => s[chave]));
  const passo = Math.pow(10, Math.floor(Math.log10(max))) / (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 0.5 : 1);
  const topo = Math.ceil(max / passo) * passo;
  const w = (L - m.l - m.r) / serie.length, bw = Math.max(4, Math.min(28, w - 6));
  const y = (v) => m.t + (A - m.t - m.b) * (1 - v / topo);
  let g = '';
  for (let v = 0; v <= topo; v += passo) g += `<line x1="${m.l}" x2="${L - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
  const cada = Math.ceil(serie.length / 8);
  serie.forEach((s, i) => {
    const x = m.l + i * w + (w - bw) / 2, h = A - m.b - y(s[chave]);
    if (s[chave] > 0) g += `<path d="M${x},${A - m.b}V${y(s[chave]) + Math.min(4, h)}q0,-4 4,-4h${bw - 8}q4,0 4,4V${A - m.b}z" fill="var(--serie-a)"/>`;
    g += `<rect x="${m.l + i * w}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-dica="<b>${rotuloDia(s.dia)}</b><br>${num(s[chave])} ${esc(nome)}"/>`;
    if (i % cada === 0) g += `<text x="${m.l + i * w + w / 2}" y="${A - 8}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
  });
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="${esc(nome)} por dia">${g}</svg><div class="dica"></div></div>`;
}

/** Linha do total de participantes. */
function graficoLinha(serie) {
  const L = 640, A = 220, m = { t: 14, r: 10, b: 26, l: 52 };
  const vals = serie.map((s) => s.total);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (max - min < 10) { min -= 5; max += 5; }
  const folga = (max - min) * 0.15; min = Math.max(0, Math.floor(min - folga)); max = Math.ceil(max + folga);
  const x = (i) => m.l + (serie.length < 2 ? 0 : (i * (L - m.l - m.r)) / (serie.length - 1));
  const y = (v) => m.t + (A - m.t - m.b) * (1 - (v - min) / (max - min));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = Math.round(min + ((max - min) * k) / 4); g += `<line x1="${m.l}" x2="${L - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`; }
  const pts = serie.map((s, i) => `${x(i)},${y(s.total)}`).join(' ');
  g += `<polygon points="${m.l},${A - m.b} ${pts} ${x(serie.length - 1)},${A - m.b}" fill="var(--serie-a)" opacity=".1"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="var(--serie-a)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const cada = Math.ceil(serie.length / 8);
  const w = (L - m.l - m.r) / Math.max(1, serie.length - 1);
  serie.forEach((s, i) => {
    if (i % cada === 0) g += `<text x="${x(i)}" y="${A - 8}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
    g += `<rect x="${x(i) - w / 2}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-ponto="${x(i)},${y(s.total)}" data-dica="<b>${rotuloDia(s.dia)}</b><br>${num(s.total)} participantes<br>+${num(s.entrou)} / −${num(s.saiu)}"/>`;
  });
  const ult = serie[serie.length - 1];
  g += `<circle cx="${x(serie.length - 1)}" cy="${y(ult.total)}" r="4" fill="var(--serie-a)" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<circle class="marcador" r="5" fill="var(--serie-a)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Total de participantes por dia">${g}</svg><div class="dica"></div></div>`;
}

/** Entradas para cima, saídas para baixo da linha zero. */
function graficoEntradasSaidas(serie) {
  const L = 420, A = 230, m = { t: 10, r: 8, b: 24, l: 34 };
  const max = Math.max(4, ...serie.map((s) => Math.max(s.entrou, s.saiu)));
  const zero = m.t + (A - m.t - m.b) / 2, esc2 = (A - m.t - m.b) / 2 / max;
  const w = (L - m.l - m.r) / serie.length, bw = Math.max(3, Math.min(22, w - 6));
  let g = `<line x1="${m.l}" x2="${L - m.r}" y1="${zero}" y2="${zero}" stroke="var(--mudo)" opacity=".5"/>`;
  g += `<text x="${m.l - 6}" y="${m.t + 8}" text-anchor="end">+${num(max)}</text><text x="${m.l - 6}" y="${A - m.b}" text-anchor="end">−${num(max)}</text>`;
  const cada = Math.ceil(serie.length / 6);
  serie.forEach((s, i) => {
    const x = m.l + i * w + (w - bw) / 2, he = s.entrou * esc2, hs = s.saiu * esc2;
    if (he > 0) g += `<path d="M${x},${zero - 1}V${zero - he + Math.min(3, he)}q0,-3 3,-3h${bw - 6}q3,0 3,3V${zero - 1}z" fill="var(--serie-a)"/>`;
    if (hs > 0) g += `<path d="M${x},${zero + 1}V${zero + hs - Math.min(3, hs)}q0,3 3,3h${bw - 6}q3,0 3,-3V${zero + 1}z" fill="var(--serie-b)"/>`;
    g += `<rect x="${m.l + i * w}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent" data-dica="<b>${rotuloDia(s.dia)}</b><br>Entraram: ${num(s.entrou)}<br>Saíram: ${num(s.saiu)}"/>`;
    if (i % cada === 0) g += `<text x="${m.l + i * w + w / 2}" y="${A - 6}" text-anchor="middle">${rotuloDia(s.dia)}</text>`;
  });
  return `<div class="grafico"><svg viewBox="0 0 ${L} ${A}" role="img" aria-label="Entradas e saídas por dia">${g}</svg><div class="dica"></div></div>
    <div class="legenda"><span><i style="background:var(--serie-a)"></i>Entraram (acima)</span><span><i style="background:var(--serie-b)"></i>Saíram (abaixo)</span></div>`;
}

function ligarDicas(raiz) {
  raiz.querySelectorAll('.grafico').forEach((gr) => {
    const dica = gr.querySelector('.dica'), svg = gr.querySelector('svg'), marc = svg.querySelector('.marcador');
    gr.addEventListener('pointermove', (e) => {
      const alvo = e.target.closest('[data-dica]');
      if (!alvo) { dica.style.opacity = 0; if (marc) marc.style.display = 'none'; return; }
      dica.innerHTML = alvo.dataset.dica;
      const caixa = gr.getBoundingClientRect(), esc3 = caixa.width / svg.viewBox.baseVal.width;
      let px = e.clientX - caixa.left, py = e.clientY - caixa.top;
      if (alvo.dataset.ponto && marc) {
        const [cx, cy] = alvo.dataset.ponto.split(',').map(Number);
        marc.setAttribute('cx', cx); marc.setAttribute('cy', cy); marc.style.display = '';
        px = cx * esc3; py = cy * esc3;
      }
      dica.style.left = Math.min(caixa.width - 70, Math.max(70, px)) + 'px';
      dica.style.top = py - 6 + 'px';
      dica.style.opacity = 1;
    });
    gr.addEventListener('pointerleave', () => { dica.style.opacity = 0; if (marc) marc.style.display = 'none'; });
  });
}

  if (E.buscaShopee) ligarBuscaShopee();

        ${r.erros.length ? `<ul style="margin:8px 0 0;padding-left:18px;color:var(--vermelho)">${r.erros.map((x) => `<li>${esc(x.url)}: ${esc(x.erro)}</li>`).join('')}</ul>` : ''} <a href="#agendamentos">Ver agendamentos</a></div>`;

      <div class="campo" style="min-width:150px"><label for="ordem-busca">Ordenar por</label><select id="ordem-busca" class="sel-cat" style="height:42px">${[['vendidos', 'Mais vendidos'], ['comissao', 'Maior comissão'], ['preco', 'Menor preço'], ['relevancia', 'Relevância']].map(([v, n]) => `<option value="${v}" ${(E.ordemBusca || 'vendidos') === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      <button class="botao" type="submit" style="align-self:flex-end;height:42px">${ico('busca', 16)}Buscar</button>

      ${r.temMais ? `<div style="text-align:center;margin-bottom:22px"><button class="botao sec" data-mais-busca>Ver mais resultados</button></div>` : ''}

function ligarBuscaShopee() {
  const buscar = tentar(async (pagina = 1) => {
    const termo = $('#termo-busca').value.trim(); if (!termo) return aviso('Escreva o que você procura', true);
    E.termoBusca = termo; E.ordemBusca = $('#ordem-busca').value;
    const b = $('#form-busca button[type=submit]'); b.disabled = true; b.textContent = 'Buscando…';
    try {
      const r = await api(`shopee/busca?q=${encodeURIComponent(termo)}&ordem=${E.ordemBusca}&pagina=${pagina}`);
      E.resBusca = pagina > 1 && E.resBusca ? { ...r, itens: [...E.resBusca.itens, ...r.itens] } : r;
      await telaOfertas();
    } finally { if (b.isConnected) b.disabled = false; }
  });
  $('#form-busca').onsubmit = (e) => { e.preventDefault(); buscar(1); };
  if ($('[data-mais-busca]')) $('[data-mais-busca]').onclick = () => buscar((E.resBusca.pagina || 1) + 1);
  C().querySelectorAll('[data-add-busca]').forEach((b) => (b.onclick = tentar(async () => {
    const item = E.resBusca.itens[Number(b.dataset.addBusca)], vit = b.dataset.vit === '1';
    b.disabled = true;
    const r = await api('shopee/adicionar', { method: 'POST', body: { item, vitrine: vit } });
    item.ja = { id: r.oferta.id, vitrine: vit };
    if (vit) { aviso('Na vitrine: sai no próximo horário automático'); await telaOfertas(); }
    else { await telaOfertas(); abrirCompositor(r.oferta, r.texto); }
  })));
}

async function gerarOferta(url, vitrine = false) {
  url = String(url || '').trim();
  if (!url) return aviso('Cole o link do produto', true);
  aviso('Gerando a oferta…');
  const r = await api('ofertas', { method: 'POST', body: { url, vitrine } });
  if (vitrine) {
    aviso(r.parecidas?.length ? `Na vitrine. Atenção: parece com "${r.parecidas[0].titulo}"` : 'Oferta gerada e colocada na vitrine');
    if ((location.hash.slice(1) || 'visao') === 'ofertas') telaOfertas().catch(() => {});
    return;
  }
  abrirCompositor(r.oferta, r.texto, r.parecidas || []);
  if ((location.hash.slice(1) || 'visao') === 'ofertas') telaOfertas().catch(() => {});
}

// {a|b|c}: variações sorteadas por grupo. A prévia mostra a primeira opção.
const VAR_RE = /\{([^{}\n]*\|[^{}\n]*)\}/g;
const previaVar = (t) => String(t).replace(VAR_RE, (_m, op) => op.split('|')[0]);
const temVar = (t) => new RegExp(VAR_RE.source).test(String(t));
// Mostra o texto no formato do WhatsApp (*negrito*, ~riscado~, _itálico_).
const zapHtml = (t) => esc(t).replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/~([^~\n]+)~/g, '<s>$1</s>').replace(/(^|\s)_([^_\n]+)_/g, '$1<i>$2</i>');

async function abrirCompositor(o, texto, parecidas = []) {
  const g = await api('grupos');
  const envio = g.lista.filter((x) => x.enviar);
  const amanha = new Date(Date.now() + 3600_000); amanha.setMinutes(0, 0, 0);
  const local = new Date(amanha.getTime() - amanha.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $('#camada').innerHTML = `<div class="fundo" id="fundo"><div class="cartao modal" role="dialog" aria-modal="true" aria-labelledby="tit-modal">
    <div class="modal-cab"><h2 id="tit-modal">Enviar oferta</h2><button class="icone-btn" id="fechar" aria-label="Fechar">${ico('x')}</button></div>
    <div class="modal-corpo">
      <div><div class="zap"><div class="bolha" id="previa"><div class="img">${foto(o.imagem)}</div><span id="previa-txt"></span><span class="hora">${hora(Date.now())}</span></div></div>
        <p style="color:var(--mudo);font-size:12px;margin:8px 2px 0">Link de afiliado: <a href="${esc(o.url_afiliado)}" target="_blank" rel="noopener" style="word-break:break-all">${esc(o.url_afiliado)}</a></p></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${parecidas.length ? `<div class="parecidas"><b>Parece repetida:</b> ${parecidas.map((x) => esc(x.titulo)).join(' · ')}. Confira antes de enviar para não mandar o mesmo produto duas vezes.</div>` : ''}
        <div class="campo"><label for="txt">Texto da mensagem</label><textarea id="txt" rows="8">${esc(texto)}</textarea><span class="ajuda">*negrito* · ~riscado~ · _itálico_ · {opção 1|opção 2} sorteia uma por grupo</span><div class="dica-var oculto" id="dica-var">Este texto tem variações: cada grupo recebe uma versão sorteada. A prévia mostra a primeira.</div></div>
        <div class="campo"><label>Grupos (${envio.length} com envio ligado)</label>
          ${envio.length ? `<div class="lista-grupos">${envio.map((x) => `<label><input type="checkbox" value="${x.id}" checked>${esc(x.nome)}<small>${num(x.participantes)}</small></label>`).join('')}</div>`
            : `<div class="vazio" style="padding:14px;border:1px dashed var(--borda);border-radius:10px">Nenhum grupo com envio ligado. <a href="#grupos" id="ir-grupos">Ligar grupos</a></div>`}
        </div>
        <div class="campo"><label>Quando</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="segmento"><button class="ativo" data-q="agora">Agora</button><button data-q="depois">Agendar</button></div>
          <input type="datetime-local" id="quando" value="${local}" class="oculto" style="flex:1;min-width:180px"></div>
          <span class="ajuda">Os envios saem com intervalo aleatório entre os grupos, para proteger o seu número.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="botao" id="confirmar" ${envio.length ? '' : 'disabled'} style="flex:1">${ico('enviar', 16)}Enviar para ${envio.length} grupo(s)</button>
          <button class="botao sec" id="teste-envio" type="button" title="Manda só para o seu WhatsApp (número do resumo diário)">${ico('cel', 16)}Teste para mim</button></div>
      </div>
    </div></div></div>`;
  const atualizar = () => { $('#previa-txt').innerHTML = zapHtml(previaVar($('#txt').value)); $('#dica-var').classList.toggle('oculto', !temVar($('#txt').value)); };
  atualizar();
  $('#txt').oninput = atualizar;
  let depois = false;
  const rotulo = () => { const n = $('#camada').querySelectorAll('.lista-grupos input:checked').length; $('#confirmar').innerHTML = `${ico(depois ? 'agenda' : 'enviar', 16)}${depois ? 'Agendar' : 'Enviar'} para ${n} grupo(s)`; $('#confirmar').disabled = !n; };
  $('#camada').querySelectorAll('.lista-grupos input').forEach((i) => (i.onchange = rotulo));
  $('#camada').querySelectorAll('[data-q]').forEach((b) => (b.onclick = () => {
    depois = b.dataset.q === 'depois';
    $('#camada').querySelectorAll('[data-q]').forEach((x) => x.classList.toggle('ativo', x === b));
    $('#quando').classList.toggle('oculto', !depois); rotulo();
  }));
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar;
  $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  if ($('#ir-grupos')) $('#ir-grupos').onclick = fechar;
  document.addEventListener('keydown', function esc2(e) { if (e.key === 'Escape') { fechar(); document.removeEventListener('keydown', esc2); } });
  $('#teste-envio').onclick = tentar(async () => { await api('teste-envio', { method: 'POST', body: { texto: $('#txt').value, imagem: o.imagem } }); aviso('Teste enviado para o seu WhatsApp'); });
  $('#confirmar').onclick = tentar(async () => {
    const grupos = [...$('#camada').querySelectorAll('.lista-grupos input:checked')].map((i) => Number(i.value));
    const quando = depois ? new Date($('#quando').value).getTime() : Date.now();
    await api('agendamentos', { method: 'POST', body: { ofertaId: o.id, texto: $('#txt').value, imagem: o.imagem, quando, grupos } });
    fechar();
    aviso(depois ? 'Oferta agendada' : 'Envio iniciado: acompanhe em Agendamentos');
    if (location.hash === '#agendamentos') telaAgendamentos(); else location.hash = '#agendamentos';
  });
  $('#txt').focus();
}

async function abrirEdicao(o) {
  const h = await api(`ofertas/${o.id}/precos`).catch(() => ({ lista: [] }));
  const v = (c) => (c ? (c / 100).toFixed(2).replace('.', ',') : '');
  const hist = h.lista.length > 1 ? (() => { const max = Math.max(...h.lista.map((p) => p.preco_por)), min = Math.min(...h.lista.map((p) => p.preco_por)), w = 320, alt = 60;
    const pts = h.lista.map((p, i) => `${(i / (h.lista.length - 1)) * w},${alt - 6 - ((p.preco_por - min) / Math.max(1, max - min)) * (alt - 12)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${alt}" width="100%" height="${alt}" role="img" aria-label="Histórico de preço"><polyline points="${pts}" fill="none" stroke="var(--verde)" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mudo)"><span>Menor: ${reais(min)}</span><span>Maior: ${reais(max)}</span></div>`; })() : '';
  $('#camada').innerHTML = `<div class="fundo" id="fundo"><div class="cartao modal" role="dialog" aria-modal="true" aria-labelledby="tit-ed" style="max-width:560px">
    <div class="modal-cab"><h2 id="tit-ed">Editar oferta</h2><button class="icone-btn" id="fechar" aria-label="Fechar">${ico('x')}</button></div>
    <form id="form-ed" style="display:flex;flex-direction:column;gap:12px;padding:0 20px 20px">
      <div class="campo"><label for="ed-tit">Título</label><input id="ed-tit" maxlength="200" value="${esc(o.titulo)}"></div>
      <div class="form-grade"><div class="campo"><label for="ed-de">Preço de (R$)</label><input id="ed-de" inputmode="decimal" value="${v(o.preco_de)}"></div>
        <div class="campo"><label for="ed-por">Preço por (R$)</label><input id="ed-por" inputmode="decimal" value="${v(o.preco_por)}"></div>
        <div class="campo"><label for="ed-cat">Categoria</label><select id="ed-cat">${CATS.slice(1).map(([c, n]) => `<option value="${c}" ${(o.categoria || 'outros') === c ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div>
      <div class="campo"><label for="ed-img">Foto (link https)</label><input id="ed-img" value="${esc(/^https?:/.test(o.imagem) ? o.imagem : '')}" placeholder="https://..."></div>
      <div class="campo"><label>Histórico de preço</label>${hist || `<span class="ajuda">${h.lista.length ? 'Um preço registrado até agora: ' + reais(h.lista[0].preco_por) : 'Ainda sem histórico'}. O Ofertix anota cada mudança de preço.</span>`}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px"><button class="botao sec" type="button" id="cancelar-ed">Cancelar</button><button class="botao" type="submit">Salvar</button></div>
    </form></div></div>`;
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar; $('#cancelar-ed').onclick = fechar; $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  $('#form-ed').onsubmit = tentar(async (e) => {
    e.preventDefault();
    await api('ofertas/' + o.id, { method: 'PUT', body: { titulo: $('#ed-tit').value, precoDe: $('#ed-de').value.replace(/\./g, ''), precoPor: $('#ed-por').value.replace(/\./g, ''), imagem: $('#ed-img').value || (/^https?:/.test(o.imagem) ? '' : o.imagem), categoria: $('#ed-cat').value } });
    fechar(); aviso('Oferta salva'); telaOfertas();
  });
}

async function telaAgendamentos() {

function enviarDeNovo(id) {
  const d = new Date(Date.now() + 3600_000); d.setMinutes(0, 0, 0);
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $('#camada').innerHTML = `<div class="fundo" id="fundo"><div class="cartao modal" role="dialog" aria-modal="true" aria-labelledby="tit-rep" style="max-width:440px">
    <div class="modal-cab"><h2 id="tit-rep">Enviar de novo</h2><button class="icone-btn" id="fechar" aria-label="Fechar">${ico('x')}</button></div>
    <div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:14px"><p style="margin:0;color:var(--texto-2)">Mesmo texto e mesmos grupos. A proteção contra repetição continua valendo: grupo que recebeu esta oferta há pouco é pulado.</p>
      <div class="segmento"><button class="ativo" data-rq="agora">Agora</button><button data-rq="depois">Agendar</button></div>
      <input type="datetime-local" id="rep-quando" value="${local}" class="oculto">
      <button class="botao" id="rep-ok">${ico('repetir', 16)}Enviar de novo</button></div></div></div>`;
  let depois = false;
  const fechar = () => ($('#camada').innerHTML = '');
  $('#fechar').onclick = fechar; $('#fundo').onclick = (e) => { if (e.target.id === 'fundo') fechar(); };
  $('#camada').querySelectorAll('[data-rq]').forEach((b) => (b.onclick = () => { depois = b.dataset.rq === 'depois'; $('#camada').querySelectorAll('[data-rq]').forEach((x) => x.classList.toggle('ativo', x === b)); $('#rep-quando').classList.toggle('oculto', !depois); }));
  $('#rep-ok').onclick = tentar(async () => {
    await api(`agendamentos/${id}/repetir`, { method: 'POST', body: { quando: depois ? new Date($('#rep-quando').value).getTime() : null } });
    fechar(); aviso(depois ? 'Agendado de novo' : 'Envio iniciado'); E.filtroStatus = ''; telaAgendamentos();
  });
}

async function mostrarQr(id) {
  const caixa = $('#qr-' + id);
  if (!caixa) return;
  clearTimeout(E.timerQr);
  try {
    const r = await api(`numeros/${id}/qr`);
    if (r.estado === 'conectado') { aviso('WhatsApp conectado!'); return telaWhatsapp(); }

    if (location.hash === '#whatsapp') E.timerQr = setTimeout(() => mostrarQr(id), 5000);
  } catch (e) { aviso(e.message, true); }
}

    <section class="cartao secao-form"><h2>Amazon e Mercado Livre</h2><p>Amazon: sua tag de associado entra em todo link. Mercado Livre: cole os parâmetros do seu link de afiliado (ex.: <code>matt_tool=123&amp;matt_word=nome</code>) ou um endereço com {url}.</p>
      <div class="form-grade"><div class="campo"><label for="amz">Tag da Amazon</label><input id="amz" value="${esc(c.amazon_tag)}" placeholder="seunome-20"></div>
      <div class="campo"><label for="ml">Mercado Livre</label><input id="ml" value="${esc(c.ml_modelo)}" placeholder="matt_tool=...&matt_word=..."></div></div></section>
    <section class="cartao secao-form"><h2>Modelo da mensagem</h2><p>Campos: {titulo} {de} {por} {desconto} {cupom} {link} {loja}. Variações: escreva {opção 1|opção 2|opção 3} e cada grupo recebe uma, sorteada. Deixe em branco para usar o padrão, que já tem variações.</p>
      <div class="modal-corpo"><div class="campo"><label for="modelo">Modelo</label><textarea id="modelo" rows="9" placeholder="{🔥|⚡|🚨} *{titulo}*&#10;&#10;{de}Por *{por}* {desconto}&#10;{cupom}&#10;🛒 {Compre aqui|Link da oferta}: {link}">${esc(c.modelo_mensagem)}</textarea></div>
      <div><label style="font-size:12.5px;font-weight:600;color:var(--texto-2);display:block;margin-bottom:6px">Prévia</label><div class="zap"><div class="bolha"><div class="img">🍟</div><span id="previa-modelo"></span><span class="hora">12:00</span></div></div>
        <button class="botao sec peq oculto" type="button" id="sortear" style="margin-top:8px">Sortear outra variação</button></div></div></section>
    <section class="cartao secao-form"><h2>Quando enviar</h2><p>Fora da janela nada é enviado: o que estiver agendado espera a próxima abertura, mantendo o intervalo entre os grupos.</p>
      <div class="form-grade">
        <div class="campo"><label for="j-ini">Começar a enviar às</label><select id="j-ini">${opHoras(c.janela_inicio)}</select></div>
        <div class="campo"><label for="j-fim">Parar de enviar às</label><select id="j-fim">${opHoras(c.janela_fim)}</select><span class="ajuda">Mesmo horário nos dois = 24 horas</span></div>
        <div class="campo"><label for="rep">Não repetir a mesma oferta no mesmo grupo por</label><select id="rep">${[[0, 'Pode repetir'], [6, '6 horas'], [12, '12 horas'], [24, '24 horas'], [48, '2 dias'], [72, '3 dias'], [168, '7 dias']].map(([v, n]) => `<option value="${v}" ${Number(c.repeticao_horas) === v ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      </div>
      <div class="campo" style="margin-top:14px"><label for="horarios">Horários automáticos da vitrine</label><input id="horarios" value="${esc(c.horarios_auto)}" placeholder="09:00, 12:00, 18:00, 21:00"><span class="ajuda">Em cada horário, a oferta mais antiga da vitrine (⭐ em Ofertas) vai para todos os grupos de envio. Vazio = desligado.</span></div>
      <div class="linha-inter"><div><b>Conferir preço e estoque antes de enviar</b><div style="color:var(--mudo);font-size:13px">Shopee: se o produto acabou ou o preço subiu mais de 5%, o envio é cancelado e você vê o motivo em Agendamentos.</div></div>
        <label class="inter"><input type="checkbox" id="conferir" ${c.conferir_preco ? 'checked' : ''} aria-label="Conferir preço antes de enviar"><span></span></label></div>
      <div class="linha-inter"><div><b>Contar cliques</b><div style="color:var(--mudo);font-size:13px">O link vai como ${esc(location.host || 'ofertix.mssolucoestech.com.br')}/r/… e leva direto para o seu link de afiliado. Assim você vê quais ofertas e grupos rendem mais.</div></div>
        <label class="inter"><input type="checkbox" id="cliques" ${c.contar_cliques ? 'checked' : ''} aria-label="Contar cliques"><span></span></label></div></section>
    <section class="cartao secao-form"><h2>Resumo diário no WhatsApp</h2><p>Todo dia, no horário escolhido, você recebe no seu WhatsApp o resumo: mensagens, cliques, capturas, comissões, membros e avisos.</p>
      <div class="form-grade">
        <div class="campo"><label for="r-num">Seu número (com DDI e DDD)</label><input id="r-num" inputmode="tel" value="${esc(c.resumo_numero)}" placeholder="5511988887777"><span class="ajuda">Vazio = sem resumo</span></div>
        <div class="campo"><label for="r-hora">Horário</label><select id="r-hora">${opHoras(c.resumo_hora)}</select></div>
        <div class="campo" style="justify-content:flex-end"><button class="botao sec" type="button" id="r-teste" style="height:42px">Enviar um agora</button></div>
      </div></section>
    <section class="cartao secao-form"><h2>Envio e captura</h2><p>Intervalo aleatório entre um grupo e outro, no mesmo número.</p>
      <div class="form-grade"><div class="campo"><label for="imin">Intervalo mínimo (segundos)</label><input id="imin" type="number" min="10" max="600" value="${c.intervalo_min}"></div>
      <div class="campo"><label for="imax">Intervalo máximo (segundos)</label><input id="imax" type="number" min="15" max="900" value="${c.intervalo_max}"></div>
      <div class="campo"><label for="dmin">Desconto mínimo para capturar (%)</label><input id="dmin" type="number" min="0" max="90" value="${c.desconto_minimo}"><span class="ajuda">0 = captura qualquer oferta</span></div></div>
      <div class="linha-inter"><div><b>Publicar sozinho o que for capturado</b><div style="color:var(--mudo);font-size:13px">Ofertas novas dos grupos monitorados vão direto para todos os seus grupos de envio.</div></div>
        <label class="inter"><input type="checkbox" id="auto" ${c.auto_publicar ? 'checked' : ''} aria-label="Publicar sozinho"><span></span></label></div></section>
    <div style="display:flex;justify-content:flex-end"><button class="botao" type="submit">Salvar configurações</button></div>
    </form>
    <form class="cartao secao-form" id="form-extras" style="margin-top:16px"><h2>Mais opções</h2><p>Proteção do número, organização das ofertas e resumos.</p>
      <div class="linha-inter"><div><b>Aquecimento de número novo</b><div style="color:var(--mudo);font-size:13px">Nas 3 primeiras semanas de um número, o limite diário começa em 40 envios e sobe a cada semana. Reduz muito a chance de bloqueio.</div></div>
        <label class="inter"><input type="checkbox" id="x-aq" aria-label="Aquecimento"><span></span></label></div>
      <div class="linha-inter"><div><b>Resumo semanal no WhatsApp</b><div style="color:var(--mudo);font-size:13px">Domingo, no horário do resumo diário: mensagens, cliques, campeãs, melhores horários e grupos cansados.</div></div>
        <label class="inter"><input type="checkbox" id="x-sem" aria-label="Resumo semanal"><span></span></label></div>
      <div class="form-grade" style="margin-top:12px">
        <div class="campo"><label for="x-arq">Arquivar ofertas paradas</label><select id="x-arq">${[[0, 'Nunca'], [15, 'Depois de 15 dias'], [30, 'Depois de 30 dias'], [60, 'Depois de 60 dias'], [90, 'Depois de 90 dias']].map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select><span class="ajuda">Fora da vitrine e sem envio no período. Ficam em Ofertas › Arquivadas</span></div>
        <div class="campo"><label for="x-meta">Meta de comissão por mês (R$)</label><input id="x-meta" inputmode="decimal" placeholder="Sem meta"></div>
        <div class="campo" style="justify-content:flex-end"><button class="botao" type="submit" style="height:42px">Salvar opções</button></div>
      </div></form>`;
  api('extras').then((x) => { $('#x-aq').checked = x.aquecimento; $('#x-sem').checked = x.resumo_semanal; $('#x-arq').value = String(x.arquivar_dias); $('#x-meta').value = x.meta_comissao ? (x.meta_comissao / 100).toFixed(2).replace('.', ',') : ''; }).catch(() => {});
  $('#form-extras').onsubmit = tentar(async (e) => {
    e.preventDefault();
    await salvarExtras({ aquecimento: $('#x-aq').checked, resumo_semanal: $('#x-sem').checked, arquivar_dias: Number($('#x-arq').value), meta_comissao: Math.round(Number($('#x-meta').value.replace(/\./g, '').replace(',', '.')) * 100) || 0 });
    aviso('Opções salvas');
  });
  let t;
  let exemplos = [], ex = 0;
  const previa = () => { clearTimeout(t); t = setTimeout(async () => { try {
    const r = await api('previa', { method: 'POST', body: { modelo: $('#modelo').value } });
    exemplos = [r.texto, ...(r.exemplos || [])]; ex = 0;
    $('#previa-modelo').innerHTML = zapHtml(r.texto); $('#sortear').classList.toggle('oculto', !r.variacoes);
  } catch {} }, 250); };
  $('#sortear').onclick = () => { ex = (ex + 1) % exemplos.length; $('#previa-modelo').innerHTML = zapHtml(exemplos[ex]); };
  const salvar = () => api('config', { method: 'POST', body: {
    shopee_app_id: $('#sh-id').value, shopee_segredo: $('#sh-seg').value, amazon_tag: $('#amz').value, ml_modelo: $('#ml').value,
    modelo_mensagem: $('#modelo').value, intervalo_min: $('#imin').value, intervalo_max: $('#imax').value, desconto_minimo: $('#dmin').value, auto_publicar: $('#auto').checked,
    janela_inicio: Number($('#j-ini').value), janela_fim: Number($('#j-fim').value), repeticao_horas: Number($('#rep').value), horarios_auto: $('#horarios').value,
    conferir_preco: $('#conferir').checked, contar_cliques: $('#cliques').checked, resumo_numero: $('#r-num').value, resumo_hora: Number($('#r-hora').value),
  } });
  $('#r-teste').onclick = tentar(async () => { await salvar(); await api('resumo/teste', { method: 'POST' }); aviso('Resumo enviado para o seu WhatsApp'); });
  $('#modelo').oninput = previa; previa();
  $('#form-config').onsubmit = tentar(async (e) => {
    e.preventDefault();
    await salvar();
    aviso('Configurações salvas');
    telaConfig();
  });
}

async function telaAutomaticas() {
  const [rec, ex, ld, rp, gr] = await Promise.all([api('recorrentes'), api('extras'), api('lista-dia'), api('respostas'), api('grupos')]);
  const envio = gr.lista.filter((x) => x.enviar);
  const edR = E.editResp ? rp.lista.find((r) => r.id === E.editResp) : null;
  const curtos = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const ed = E.editRec ? rec.find((r) => r.id === E.editRec) : null;
  C().innerHTML = cabeca('raio', 'Mensagens automáticas', 'Mensagens que saem sozinhas nos grupos de envio: regras, convites e boas-vindas. Tudo passa pela mesma fila, com intervalo e janela de envio.') + `
    <div class="grade-2" style="align-items:start">
    <form class="cartao secao-form" id="form-rec"><h2>${ed ? 'Editar mensagem' : 'Nova mensagem recorrente'}</h2><p>Ex.: as regras do grupo toda segunda, ou "chame uma amiga" na sexta.</p>
      <div class="campo"><label for="rec-nome">Nome (só para você)</label><input id="rec-nome" maxlength="60" value="${esc(ed?.nome || '')}" placeholder="Regras do grupo"></div>
      <div class="campo" style="margin-top:12px"><label for="rec-txt">Mensagem</label><textarea id="rec-txt" rows="6" placeholder="📌 *Regras do grupo*&#10;Só a administração posta. Pode sair quando quiser. Os links são de afiliado.">${esc(ed?.texto || '')}</textarea><span class="ajuda">*negrito* · _itálico_ · {opção 1|opção 2}</span></div>
      <div class="campo" style="margin-top:12px"><label>Dias</label><div class="dias-sem">${curtos.map((d, i) => `<label><input type="checkbox" value="${i}" ${ed ? (ed.dias.includes(i) ? 'checked' : '') : i === 1 ? 'checked' : ''}>${d}</label>`).join('')}</div></div>
      <div class="form-grade" style="margin-top:12px"><div class="campo"><label for="rec-hora">Horário</label><input id="rec-hora" type="time" value="${esc(ed?.hora || '10:00')}"></div>
        <div class="campo" style="justify-content:flex-end;flex-direction:row;gap:8px;align-items:flex-end">${ed ? '<button class="botao sec" type="button" id="rec-cancelar">Cancelar</button>' : ''}<button class="botao" type="submit">${ed ? 'Salvar' : 'Criar'}</button></div></div>
    </form>
    <section class="cartao bloco"><h2>Recorrentes</h2><p class="sub">${rec.length} de 10</p>
      <div class="linhas">${rec.length ? rec.map((r) => `<div class="linha"><div class="meio"><div class="tit">${esc(r.nome)}</div><div class="det">${r.dias.map((d) => curtos[d]).join(', ')} às ${esc(r.hora)}${r.ultimo ? ' · última: ' + esc(r.ultimo.split('-').reverse().join('/')) : ''}</div></div>
        <label class="inter" title="Ligada"><input type="checkbox" data-rec-ativo="${r.id}" ${r.ativo ? 'checked' : ''} aria-label="Ligada"><span></span></label>
        <button class="botao sec peq" data-rec-editar="${r.id}" aria-label="Editar">${ico('editar', 14)}</button><button class="botao sec peq" data-rec-apagar="${r.id}" aria-label="Apagar">${ico('lixo', 14)}</button></div>`).join('')
        : '<div class="vazio">Nenhuma mensagem recorrente.</div>'}</div></section>
    </div>
    <form class="cartao secao-form" id="form-bv" style="margin-top:16px"><h2>Boas-vindas</h2><p>Quando alguém entra num grupo de envio, o Ofertix junta as entradas e manda uma boas-vindas por grupo, no máximo uma a cada intervalo escolhido. Use {grupo} para o nome do grupo e {novas} para quantas pessoas entraram.</p>
      <div class="campo"><label for="bv-txt">Mensagem (vazio = desligado)</label><textarea id="bv-txt" rows="4" placeholder="💖 Boas-vindas a quem chegou no {grupo}! Aqui sai achadinho todo dia. Fique à vontade e chame as amigas.">${esc(ex.boas_vindas)}</textarea></div>
      <div class="form-grade" style="margin-top:12px"><div class="campo"><label for="bv-min">No máximo uma a cada</label><select id="bv-min">${[[30, '30 minutos'], [60, '1 hora'], [180, '3 horas'], [360, '6 horas'], [720, '12 horas'], [1440, '1 dia']].map(([v2, n]) => `<option value="${v2}" ${Number(ex.boas_vindas_min) === v2 ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="campo" style="justify-content:flex-end"><button class="botao" type="submit" style="height:42px">Salvar boas-vindas</button></div></div>
    </form>
    <div class="grade-2" style="align-items:start;margin-top:16px">
    <form class="cartao secao-form" id="form-enq"><h2>${ico('enquete', 18)} Enquete no grupo</h2><p>Pergunte o que o grupo quer ver. Enquete engaja e mostra o que vender amanhã.</p>
      <div class="campo"><label for="enq-p">Pergunta</label><input id="enq-p" maxlength="255" placeholder="Qual achadinho vocês querem amanhã?"></div>
      <div class="campo" style="margin-top:12px"><label for="enq-o">Opções (uma por linha, de 2 a 12)</label><textarea id="enq-o" rows="4" placeholder="🍳 Cozinha&#10;💄 Beleza&#10;🗂️ Organização"></textarea></div>
      <div class="linha-inter"><div><b>Pode escolher mais de uma</b></div><label class="inter"><input type="checkbox" id="enq-m" aria-label="Pode escolher mais de uma"><span></span></label></div>
      <div class="campo" style="margin-top:6px"><label>Grupos</label>${envio.length ? `<div class="lista-grupos" style="max-height:150px">${envio.map((x) => `<label><input type="checkbox" value="${x.id}" checked>${esc(x.nome)}<small>${num(x.participantes)}</small></label>`).join('')}</div>` : '<div class="vazio" style="padding:10px">Ligue o envio em um grupo.</div>'}</div>
      <div class="form-grade" style="margin-top:12px"><div class="campo"><label for="enq-q">Quando (vazio = agora)</label><input id="enq-q" type="datetime-local"></div>
        <div class="campo" style="justify-content:flex-end"><button class="botao" type="submit" style="height:42px" ${envio.length ? '' : 'disabled'}>${ico('enviar', 16)}Enviar enquete</button></div></div>
    </form>
    <form class="cartao secao-form" id="form-lista"><h2>${ico('lista', 18)} Lista do dia</h2><p>No fim do dia, uma mensagem com as ofertas mais procuradas de hoje e o link da vitrine, para quem perdeu. Só sai se saíram pelo menos 2 ofertas.</p>
      <div class="linha-inter"><div><b>Mandar a lista todo dia</b></div><label class="inter"><input type="checkbox" id="ld-on" ${ld.ativo ? 'checked' : ''} aria-label="Mandar a lista todo dia"><span></span></label></div>
      <div class="form-grade" style="margin-top:12px"><div class="campo"><label for="ld-hora">Horário</label><input id="ld-hora" type="time" value="${esc(ld.hora)}"></div>
        <div class="campo"><label for="ld-qtd">Quantas ofertas</label><input id="ld-qtd" type="number" min="3" max="10" value="${ld.quantas}"></div></div>
      <div class="campo" style="margin-top:12px"><label for="ld-tit">Título</label><input id="ld-tit" maxlength="120" value="${esc(ld.titulo)}"></div>
      <div class="campo" style="margin-top:12px"><label>Prévia de hoje</label>${ld.previa ? `<div class="zap"><div class="bolha"><span>${zapHtml(previaVar(ld.previa))}</span><span class="hora">${esc(ld.hora)}</span></div></div>` : '<span class="ajuda">Hoje ainda saíram menos de 2 ofertas.</span>'}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px">${ld.previa ? '<button class="botao sec" type="button" id="ld-agora">Mandar agora</button>' : ''}<button class="botao" type="submit">Salvar</button></div>
    </form>
    </div>
    <div class="grade-2" style="align-items:start;margin-top:16px">
    <form class="cartao secao-form" id="form-resp"><h2>${ico('msg', 18)} ${edR ? 'Editar resposta' : 'Respostas no privado'}</h2><p>Quando alguém chama o número no privado com uma destas palavras, recebe a resposta na hora. Cada pessoa recebe a mesma resposta no máximo uma vez a cada 12 horas.</p>
      <div class="campo"><label for="rp-pal">Palavras que disparam</label><input id="rp-pal" value="${esc(edR ? edR.palavras.join(', ') : '')}" placeholder="grupo, link, entrar"><span class="ajuda">Separe por vírgula. Maiúsculas e acentos não importam.</span></div>
      <div class="campo" style="margin-top:12px"><label for="rp-txt">Resposta</label><textarea id="rp-txt" rows="4" placeholder="Oi, {nome}! Escolha o seu grupo aqui: {link_grupos}">${esc(edR?.texto || '')}</textarea><span class="ajuda">Campos: {nome} {link_grupos} {vitrine} {cupons} · {opção 1|opção 2}</span></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">${edR ? '<button class="botao sec" type="button" id="rp-cancelar">Cancelar</button>' : ''}<button class="botao" type="submit">${edR ? 'Salvar' : 'Criar resposta'}</button></div>
      ${!edR && !rp.lista.length ? `<p class="ajuda" style="margin:14px 0 6px;font-weight:600">Sugestões para começar:</p><div style="display:flex;gap:6px;flex-wrap:wrap">${rp.sugestoes.map((x, i) => `<button type="button" class="chip" data-sug="${i}">${esc(x.palavras.split(',')[0])}</button>`).join('')}</div>` : ''}
    </form>
    <section class="cartao bloco"><h2>Respostas</h2><p class="sub">${rp.lista.length} de 15</p>
      <div class="linhas">${rp.lista.length ? rp.lista.map((r) => `<div class="linha"><div class="meio"><div class="tit">${r.palavras.map(esc).join(', ')}</div><div class="det">${esc(r.texto.split('\n')[0].slice(0, 70))} · ${num(r.usos)} uso(s)</div></div>
        <label class="inter" title="Ligada"><input type="checkbox" data-rp-ativo="${r.id}" ${r.ativo ? 'checked' : ''} aria-label="Ligada"><span></span></label>
        <button class="botao sec peq" data-rp-editar="${r.id}" aria-label="Editar">${ico('editar', 14)}</button><button class="botao sec peq" data-rp-apagar="${r.id}" aria-label="Apagar">${ico('lixo', 14)}</button></div>`).join('') : '<div class="vazio">Nenhuma resposta ainda.</div>'}</div>
      <div class="campo" style="margin-top:14px"><label for="rp-teste">Testar uma mensagem</label><div style="display:flex;gap:6px"><input id="rp-teste" class="campo-mini" style="flex:1" placeholder="Ex.: oi, qual o link do grupo?"><button class="botao sec peq" type="button" id="rp-testar">Testar</button></div><div id="rp-res"></div></div>
    </section>
    </div>`;
  // Enquete
  $('#form-enq').onsubmit = tentar(async (e) => {
    e.preventDefault();

    await api('enquetes', { method: 'POST', body: { pergunta: $('#enq-p').value, opcoes: $('#enq-o').value, multipla: $('#enq-m').checked, grupos, quando: $('#enq-q').value ? new Date($('#enq-q').value).getTime() : null } });

  });
  // Lista do dia
  const lerLd = () => ({ ativo: $('#ld-on').checked, hora: $('#ld-hora').value, quantas: Number($('#ld-qtd').value), titulo: $('#ld-tit').value });
  $('#form-lista').onsubmit = tentar(async (e) => { e.preventDefault(); await api('lista-dia', { method: 'POST', body: lerLd() }); aviso($('#ld-on').checked ? 'Lista do dia ligada' : 'Lista do dia desligada'); telaAutomaticas(); });
  if ($('#ld-agora')) $('#ld-agora').onclick = tentar(async () => { await api('lista-dia', { method: 'POST', body: lerLd() }); await api('lista-dia/agora', { method: 'POST' }); aviso('Lista na fila: acompanhe em Agendamentos'); });
  // Respostas
  const lerRp = () => ({ palavras: $('#rp-pal').value, texto: $('#rp-txt').value });
