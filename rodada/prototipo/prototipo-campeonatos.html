<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodada — Protótipo v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0b1410;--panel:#12201a;--panel2:#182b22;--line:#24392e;--topbg:rgba(11,20,16,.92);--outer:#050a08;
  --text:#eaf4ee;--muted:#8fa89a;--accent:#22c55e;--accent2:#a3e635;
  --warn:#f59e0b;--danger:#ef4444;--yellow:#facc15;--radius:16px;
}
:root[data-theme="light"]{
  --bg:#f3f6f4;--panel:#ffffff;--panel2:#eaf0ec;--line:#d6e1da;--topbg:rgba(243,246,244,.92);--outer:#dfe7e2;
  --text:#0f1f17;--muted:#5b7166;--accent:#16a34a;--accent2:#65a30d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--outer);font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px}
.app.nonav{padding-bottom:24px}
@media(min-width:600px){body{padding:24px 0}.app{border-radius:28px;min-height:calc(100vh - 48px);border:1px solid var(--line);overflow:hidden}}

.top{position:sticky;top:0;z-index:5;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#06210f;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;min-width:0}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back,.avatar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;cursor:pointer;flex:none}
.avatar{border-radius:50%;font-weight:800;font-size:13px}
.spacer{flex:1}
.pill{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;background:rgba(34,197,94,.15);color:var(--accent);white-space:nowrap}
.pill.red{background:rgba(239,68,68,.15);color:var(--danger)}

main{padding:16px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:12px;margin:22px 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.45}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card + .card{margin-top:10px}
.champ{cursor:pointer;display:flex;gap:12px;align-items:center}
.champ:hover{border-color:var(--accent)}
.champ .ico{width:46px;height:46px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:22px;flex:none}
.champ b{display:block}
.champ span{font-size:12px;color:var(--muted)}
.progress{height:6px;background:var(--panel2);border-radius:99px;margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#06210f;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:14px}
.btn.block{width:100%}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn.live{background:#ef4444;color:#fff}
.btn.wa{background:#25d366;color:#052e16}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;width:30px;height:30px;cursor:pointer;flex:none;font-size:13px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{font-size:18px;display:block}
.stat span{font-size:11px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px -16px 14px;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.round-title{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.game{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px 11px}
.game + .game{margin-top:8px}
.game.click{cursor:pointer}
.game.click:hover{border-color:var(--accent)}
.game.live{border-color:rgba(239,68,68,.5)}
.gmeta{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.team.r{justify-content:flex-end;text-align:right}
.team span:not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.tbd span:not(.dot){color:var(--muted);font-style:italic;font-weight:500}
.dot{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;overflow:hidden}
.dot img{width:100%;height:100%;object-fit:cover}
.dot.lg{width:56px;height:56px;border-radius:16px;font-size:16px}
.score{font-weight:800;font-size:18px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.score small{display:block;font-size:10px;color:var(--muted);font-weight:600}
.score.pend{font-size:12px;color:var(--muted);font-weight:600}
.score.pend em{display:block;font-style:normal;color:var(--accent);font-size:11px}
.score.lv{color:#f87171}
.tagx{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tagx.red{background:rgba(239,68,68,.15);color:#f87171}
.tagx.y{background:rgba(250,204,21,.18);color:#ca8a04}
.tagx.ok{background:rgba(34,197,94,.15);color:var(--accent)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:4px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:600;font-size:11px;text-align:center;padding:8px 3px;border-bottom:1px solid var(--line)}
td{padding:9px 3px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
td.t{text-align:left}
td.t div{display:flex;align-items:center;gap:8px;font-weight:600}
th.t{text-align:left}
tr.lead td:first-child{color:var(--accent);font-weight:800}
td.pts{font-weight:800}
.tbl-title{font-size:13px;font-weight:700;margin:0 0 4px;padding:4px 2px}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:14px}
.row .grow span{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.badge.ok{background:rgba(34,197,94,.15);color:var(--accent)}
.badge.wait{background:rgba(245,158,11,.15);color:var(--warn)}
.badge.open{background:rgba(143,168,154,.15);color:var(--muted)}
.badge.bad{background:rgba(239,68,68,.15);color:#f87171}
.rank{width:26px;height:26px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.rank.g{background:linear-gradient(135deg,#fde047,#f59e0b);color:#3b2a00}
.avatarp{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-weight:800;font-size:13px;overflow:hidden;flex:none}
.avatarp img{width:100%;height:100%;object-fit:cover}
.avatarp.lg{width:84px;height:84px;font-size:30px;margin:0 auto}
.dot.lg{margin:0 auto}

.hero{border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.hero .arena{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;opacity:.85;margin-bottom:10px}
.hero .arena .logo{width:26px;height:26px;border-radius:8px;font-size:12px}
.hero .tag{font-size:11px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}
.hero h1{font-size:24px}
.hero .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.sponsors{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sponsors small{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}
.spn{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:4px 9px 4px 4px;font-size:12px;font-weight:700;text-decoration:none}
.spn .sl{width:24px;height:24px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:10px;overflow:hidden}
.spn .sl img{width:100%;height:100%;object-fit:cover}

.cta{background:linear-gradient(135deg,rgba(34,197,94,.18),rgba(163,230,53,.08));border:1px solid rgba(34,197,94,.35);border-radius:16px;padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.cta b{display:block}
.cta span{font-size:12px;color:var(--muted)}

.bracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.bcol{min-width:180px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bcol h4{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.bmatch{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bmatch.click{cursor:pointer}
.bteam{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;font-weight:600}
.bteam + .bteam{border-top:1px solid var(--line)}
.bteam span:not(.dot){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bteam.tbd span:not(.dot){color:var(--muted);font-style:italic;font-weight:500}
.bteam.win{background:rgba(34,197,94,.1)}
.bteam.win span:not(.dot){color:var(--accent)}
.bteam b{font-variant-numeric:tabular-nums}
.bmeta{font-size:10px;color:var(--muted);padding:5px 10px;background:var(--panel2)}
.champion{text-align:center;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(250,204,21,.18),rgba(245,158,11,.06));border:1px solid rgba(250,204,21,.35);margin-bottom:14px}
.champion b{font-size:20px;display:block;margin-top:4px}

.search{position:relative;margin-bottom:10px}
.search .inp{padding-left:38px}
.search span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(34,197,94,.1)}
.lock{text-align:center;padding:36px 14px}
.lock .big{font-size:56px;margin-bottom:6px}
.mine{background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(34,197,94,.08));border:1px solid rgba(59,130,246,.35);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px;display:flex;gap:8px;align-items:center}
.ctx{font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:flex;gap:6px;align-items:center}
.vis{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.prow-wrap{border-bottom:1px solid var(--line);padding:6px 0}
.prow-wrap .prow-edit{border-bottom:0;padding:0}
.prow-wrap .sub2{display:flex;gap:8px;align-items:center;margin-top:6px;padding-left:40px}
.prow-wrap .sub2 .inp{padding:7px 9px;font-size:13px}
.prow-wrap .sub2 label{margin:0;display:flex;gap:5px;align-items:center;white-space:nowrap;font-size:11px;cursor:pointer}

.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;width:calc(100% - 24px);max-width:416px;z-index:40;background:rgba(10,18,14,.95);color:#eaf4ee;border:1px solid rgba(34,197,94,.55);border-radius:18px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.tour.ontop{top:66px;bottom:auto}
.tour .tp{height:4px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;margin-bottom:8px}
.tour .tp i{display:block;height:100%;background:#22c55e;transition:width .4s}
.tour b{font-size:15px;display:block}
.tour p{margin:3px 0 8px;font-size:13px;color:#b7c9bf;line-height:1.4}
.tour .tb{display:flex;gap:6px;align-items:center}
.tour small{color:#8fa89a;font-size:11px;margin-right:auto}
.tour .iconbtn{background:#182b22;border-color:#24392e;color:#eaf4ee}
.plan{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--panel)}
.plan.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.plan .price{font-size:28px;font-weight:800;margin-top:6px}
.plan ul{padding-left:18px;margin:10px 0 12px;font-size:13px;color:var(--muted);line-height:1.7}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;color:var(--muted);line-height:1.4}
.fbox b{display:block;color:var(--text);font-size:14px;margin:4px 0 2px}
.fbox .fi{font-size:22px}
details.faq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
details.faq summary{font-weight:700;cursor:pointer;font-size:14px}
details.faq p{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.stepsx{display:grid;gap:8px}
.stx{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stx .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#06210f;display:grid;place-items:center;font-weight:800;flex:none}
.agrid{display:grid;gap:4px;font-size:11px}
.agrid .h{font-weight:700;color:var(--muted);text-align:center;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agrid .tm{color:var(--muted);font-weight:700;padding:9px 0}
.slot{border-radius:8px;padding:5px 6px;min-height:36px;border:1px dashed var(--line);line-height:1.25;overflow:hidden}
.slot small{color:var(--muted);font-size:10px}
.slot.free{color:var(--muted);text-align:center;cursor:pointer;display:grid;place-items:center}
.slot.free:hover{border-color:var(--accent);color:var(--accent)}
.slot.game{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.35)}
.slot.book{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);cursor:pointer}
.slot.conf{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.55)}
.post{padding:12px 0;border-bottom:1px solid var(--line)}
.post.pin{background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.3);border-radius:12px;padding:12px;margin-bottom:10px}
.post .ph{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.post .ph b{color:var(--text);font-size:13px}
.post p{margin:6px 0 0;font-size:14px;line-height:1.45;white-space:pre-line}
.guess{display:grid;grid-template-columns:1fr 46px 14px 46px 1fr;gap:6px;align-items:center}
.guess .inp{text-align:center;padding:8px 4px;font-weight:800;font-size:16px}
.rolebar{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);border-radius:12px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.pro{font-size:10px;font-weight:800;background:linear-gradient(135deg,#facc15,#f59e0b);color:#3b2a00;padding:2px 6px;border-radius:6px;margin-left:4px;letter-spacing:0;vertical-align:middle}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--topbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:6}
@media(min-width:600px){.nav{bottom:24px;border-radius:0 0 28px 28px;border:1px solid var(--line)}}
.nav button{background:none;border:0;padding:8px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button .i{font-size:19px}
.nav button.on{color:var(--text);background:var(--panel2)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:92vh;overflow:auto}
@media(min-width:600px){.sheet{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.close{float:right;background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:32px;height:32px;cursor:pointer}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 6px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:auto}
textarea.inp{resize:vertical;min-height:110px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.scorebox .inp{text-align:center;font-size:28px;font-weight:800;padding:8px}
.scorebox .x{color:var(--muted);font-weight:700}
.scorebox .nm{font-size:12px;text-align:center;color:var(--muted);margin-top:6px;font-weight:600}
.pens{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.pens .grid2 .inp{text-align:center;font-weight:800}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pn em{font-style:normal;font-size:10px;font-weight:700;color:#f87171;margin-left:6px}
.pctl{display:flex;align-items:center;gap:6px;flex:none}
.stepper{display:flex;align-items:center;gap:6px;font-size:13px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:700}
.stepper b{min-width:14px;text-align:center}

<script>
/* =========================================================
   Configuração rápida
   ========================================================= */
const APP_NAME = 'Rodada';          // nome provisório: troque aqui
const DOMAIN   = 'seusite.com.br';  // domínio de exemplo
const KEY      = 'rodada-proto-v5'; // chave dos dados salvos no navegador

/* =========================================================
   Esportes: cada um com sua regra de placar
   ========================================================= */
const FOOT = {unit:'gols', sets:false, draws:true, cards:true, scorers:true, steps:[1], pts:[3,1,0], wo:[3,0], scorerTitle:'Artilharia', ball:'⚽', diff:'SG', tieLabel:'Pênaltis', who:'Jogadores'};
const SETS = {unit:'sets', sets:true, draws:false, cards:false, scorers:false, steps:[1], pts:[3,0,0], wo:[2,0], scorerTitle:'', ball:'', diff:'SS', tieLabel:'', who:'Atletas'};
const SPORTS = {
  'Futebol society':        {...FOOT, icon:'⚽'},
  'Futsal':                 {...FOOT, icon:'⚽'},
  'Futebol de campo':       {...FOOT, icon:'⚽'},
  'Basquete':               {...FOOT, icon:'🏀', unit:'pontos', draws:false, cards:false, steps:[1,2,3], pts:[2,0,1], wo:[20,0], scorerTitle:'Cestinhas', ball:'🏀', diff:'SC', tieLabel:''},
  'Handebol':               {...FOOT, icon:'🤾', ball:'🤾', wo:[10,0], tieLabel:'Tiros de 7 m'},
  'Vôlei':                  {...SETS, icon:'🏐', wo:[3,0]},
  'Vôlei de praia':         {...SETS, icon:'🏐', who:'Dupla'},
  'Futevôlei':              {...SETS, icon:'⚽', who:'Dupla'},
  'Beach tennis':           {...SETS, icon:'🎾', who:'Dupla'},
  'Tênis':                  {...SETS, icon:'🎾'},
  'Padel':                  {...SETS, icon:'🎾', who:'Dupla'},
  'Tênis de mesa':          {...SETS, icon:'🏓', wo:[3,0]},
  'E-sports (EA FC)':       {...FOOT, icon:'🎮', cards:false},
  'E-sports (CS2/Valorant)':{...SETS, icon:'🎮', unit:'mapas', diff:'SM'},
};
const SP = c => SPORTS[c.sport] || SPORTS['Futebol society'];
const FORMATS = {pontos:'Pontos corridos', grupos:'Grupos + mata-mata', mata:'Mata-mata'};
const TIEBREAK = {v:'Vitórias', sg:'Saldo', gp:'Marcados (gols/pontos/sets)', cd:'Confronto direto', cards:'Menos cartões', sorteio:'Sorteio'};
const EXP_CATS = ['Campo / quadra','Arbitragem','Premiação','Material','Divulgação','Outros'];

/* =========================================================
   Utilidades
   ========================================================= */
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const brl = v => (+v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const COLORS = ['#e11d48','#2563eb','#f59e0b','#16a34a','#7c3aed','#0891b2','#db2777','#ea580c','#0d9488','#4f46e5','#65a30d','#9333ea','#be123c','#0369a1','#a16207','#15803d'];
const BRAND_PRESETS = ['#22c55e','#3b82f6','#ef4444','#f59e0b','#a855f7','#06b6d4','#ec4899','#f97316'];
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}).replace('.', ''); };
const fmtLong = iso => { if (!iso) return 'Data a definir'; const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'}); };
const today = () => new Date().toISOString().slice(0, 10);
const nextSaturday = () => { const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); return d.toISOString().slice(0, 10); };
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
function hexA(hex, a){ let h = (hex || '#22c55e').replace('#',''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function waLink(phone, text){ let d = String(phone || '').replace(/\D/g, ''); if (d && d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(text)}`; }
const shortStage = s => ({Semifinal:'Semi', Quartas:'Quartas', Oitavas:'Oitavas'}[s] || s);
const STAGE = n => ({8:'Oitavas', 4:'Quartas', 2:'Semifinal', 1:'Final'}[n] || `Fase de ${n * 2}`);
const ytId = url => (String(url).match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/) || [])[1] || null;
const platform = url => /youtu/.test(url) ? 'YouTube' : /instagram/.test(url) ? 'Instagram' : /tiktok/.test(url) ? 'TikTok' : 'Link';
const splitList = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const initials = s => String(s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

function resizeImage(file, size, cb){
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const k = Math.max(size / img.width, size / img.height), w = img.width * k, h = img.height * k;
    cv.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
    cb(cv.toDataURL('image/jpeg', .85));
  }; img.src = rd.result; };
  rd.readAsDataURL(file);
}
function download(name, content, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function printDoc(title, html){
  const fr = document.createElement('iframe'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(fr);
  const d = fr.contentWindow.document;
  d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:24px;font-size:12px}
    h1{font-size:20px;margin:0 0 4px} h2{font-size:14px;margin:18px 0 6px} .muted{color:#666}
    table{width:100%;border-collapse:collapse;margin-top:6px} th,td{border:1px solid #bbb;padding:5px 6px;text-align:center}
    th{background:#eee} td.l,th.l{text-align:left} .box{display:inline-block;width:46px;height:34px;border:2px solid #111;vertical-align:middle}
    .sig{display:flex;gap:24px;margin-top:40px} .sig div{flex:1;border-top:1px solid #111;padding-top:4px;text-align:center}
    .poster{text-align:center;margin-top:40px} .poster h1{font-size:34px} .poster img{width:320px;height:320px;margin:24px auto;display:block}
    @page{margin:14mm}</style></head><body>${html}</body></html>`);
  d.close();
  setTimeout(() => { fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(() => fr.remove(), 1500); }, 350);
}

/* ---------- vídeos enviados: guardados no IndexedDB do navegador ---------- */
const media = {
  urls: {}, mem: {},
  open(){ return new Promise((res, rej) => { try { const r = indexedDB.open('rodada-media', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('v'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async put(k, blob){ this.mem[k] = blob; try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('v', 'readwrite'); tx.objectStore('v').put(blob, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) { return false; } },
  async get(k){ if (this.mem[k]) return this.mem[k]; try { const db = await this.open(); return await new Promise(res => { const tx = db.transaction('v'); const rq = tx.objectStore('v').get(k); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); }); } catch (e) { return null; } },
  async del(k){ delete this.mem[k]; try { const db = await this.open(); db.transaction('v', 'readwrite').objectStore('v').delete(k); } catch (e) {} },
  async url(k){ if (this.urls[k]) return this.urls[k]; const b = await this.get(k); if (!b) return null; this.urls[k] = URL.createObjectURL(b); return this.urls[k]; }
};

/* =========================================================
   Modelo de dados
   ========================================================= */
function newGame(x){
  return Object.assign({id: uid(), stage:'liga', group:null, seq:1, label:'', name:'', home:null, away:null, srcH:null, srcA:null,
    hg:null, ag:null, ph:null, pa:null, scorers:[], cards:[], live:false, events:[], clock:{run:false, t0:0, acc:0},
    date:'', time:'', field:'', ref:null, mes:null, wo:null, postponed:false}, x);
}
function roundRobin(ids){
  const t = [...ids]; if (t.length % 2) t.push(null);
  const n = t.length, rounds = []; let arr = [...t];
  for (let r = 0; r < n - 1; r++){
    const games = [];
    for (let i = 0; i < n / 2; i++){ const a = arr[i], b = arr[n - 1 - i]; if (a && b) games.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(games); arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  return rounds;
}
function koRounds(G, first, seq0){
  let prev = first, s = seq0;
  while (true){
    const lab = STAGE(prev.length);
    prev.forEach((g, i) => { g.stage = 'ko'; g.seq = s; g.label = lab; g.name = lab === 'Final' ? 'Final' : `${shortStage(lab)} ${i + 1}`; });
    G.push(...prev);
    if (prev.length === 1) break;
    const nx = []; for (let i = 0; i < prev.length; i += 2) nx.push(newGame({srcH:{type:'win', game: prev[i].id}, srcA:{type:'win', game: prev[i + 1].id}}));
    prev = nx; s++;
  }
}
const KO_SEEDS = {
  '2-1':[['A1','B1']], '2-2':[['A1','B2'],['B1','A2']], '2-4':[['A1','B4'],['B2','A3'],['B1','A4'],['A2','B3']],
  '4-1':[['A1','B1'],['C1','D1']], '4-2':[['A1','B2'],['C1','D2'],['B1','A2'],['D1','C2']]
};
const groupLetters = c => [...new Set(c.teams.map(t => t.group).filter(Boolean))].sort();
function qualifyOptions(c){

  return (L.length === 4 ? [1, 2] : [1, 2, 4]).filter(q => q <= min);

function addGroupKO(c, G){

  const maxR = Math.max(0, ...G.filter(g => g.stage === 'grupo').map(g => g.seq));
  if (!qualifyOptions(c).includes(c.rules.qualify)) c.rules.qualify = qualifyOptions(c).includes(2) ? 2 : 1;
  const src = s => ({type:'grp', g: s[0], pos: +s.slice(1)});
  const first = KO_SEEDS[`${L.length}-${c.rules.qualify}`].map(([h, a]) => newGame({srcH: src(h), srcA: src(a)}));
  koRounds(G, first, maxR + 1);
}
function buildGames(c){
  const T = c.teams, G = [];
  if (c.format === 'pontos'){
    roundRobin(T.map(t => t.id)).forEach((rg, ri) => rg.forEach(([h, a]) => G.push(newGame({stage:'liga', seq: ri + 1, label:`Rodada ${ri + 1}`, home: h, away: a}))));
  }
  if (c.format === 'grupos'){
    const ng = T.length >= 12 ? 4 : 2, L = 'ABCD'.slice(0, ng).split('');
    T.forEach((t, i) => t.group = L[i % ng]);
    L.forEach(g => roundRobin(T.filter(t => t.group === g).map(t => t.id)).forEach((rg, ri) =>
      rg.forEach(([h, a]) => G.push(newGame({stage:'grupo', group: g, seq: ri + 1, label:`Rodada ${ri + 1}`, home: h, away: a})))));
    addGroupKO(c, G);
  }
  if (c.format === 'mata'){
    const first = []; for (let i = 0; i < T.length / 2; i++) first.push(newGame({srcH:{type:'team', id: T[i].id}, srcA:{type:'team', id: T[T.length - 1 - i].id}}));
    koRounds(G, first, 1);
  }
  c.games = G;
}
function rebuildKO(c){

  const G = c.games.filter(g => g.stage !== 'ko'); addGroupKO(c, G); c.games = G; schedule(c, false); resolveKO(c); return true;
}
function schedule(c, all){

  c.games.forEach(g => (bySeq[g.seq] = bySeq[g.seq] || []).push(g));
  Object.keys(bySeq).forEach(s => {
    const date = addDays(start, 7 * (s - 1)), nf = Math.max(1, fields.length);
    bySeq[s].forEach((g, i) => {
      if (!all && (isDecided(g) || g.live)) return;
      g.date = date; g.postponed = false; g.time = times[Math.floor(i / nf) % Math.max(1, times.length)] || ''; g.field = fields[i % nf] || '';

  });
}

const isDecided = g => !!(g.home && g.away && g.hg !== null && !g.live &&
  (g.stage !== 'ko' || g.hg !== g.ag || (g.ph !== null && g.pa !== null && g.ph !== g.pa)));
const winner = g => g.hg > g.ag ? g.home : g.hg < g.ag ? g.away : (g.ph > g.pa ? g.home : g.away);
function clearRes(g){ g.hg = g.ag = g.ph = g.pa = null; g.scorers = []; g.cards = []; g.live = false; g.events = []; g.wo = null; g.clock = {run:false, t0:0, acc:0}; }
const ordered = c => [...c.games].sort((a, b) => a.seq - b.seq || (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || '') || (a.field || '').localeCompare(b.field || ''));
const labels = c => { const seen = []; ordered(c).forEach(g => { if (!seen.includes(g.label)) seen.push(g.label); }); return seen; };
const playedLabels = c => labels(c).filter(l => c.games.some(g => g.label === l && isDecided(g)));

function h2h(c, games, a, b){
  const [pw, pd, pl] = SP(c).pts; let pa = 0, pb = 0;
  games.filter(g => isDecided(g) && ((g.home === a && g.away === b) || (g.home === b && g.away === a))).forEach(g => {
    const ga = g.home === a ? g.hg : g.ag, gb = g.home === a ? g.ag : g.hg;
    if (ga > gb){ pa += pw; pb += pl; } else if (ga < gb){ pb += pw; pa += pl; } else { pa += pd; pb += pd; }
  });
  return pa - pb;
}
function standingsFor(c, games, teams){
  const [pw, pd, pl] = SP(c).pts, m = {};
  teams.forEach(t => m[t.id] = {t, P:0, J:0, V:0, E:0, D:0, GP:0, GC:0, CP:0});
  games.filter(isDecided).forEach(g => {
    const h = m[g.home], a = m[g.away]; if (!h || !a) return;
    h.J++; a.J++; h.GP += g.hg; h.GC += g.ag; a.GP += g.ag; a.GC += g.hg;
    if (g.hg > g.ag){ h.V++; a.D++; h.P += pw; a.P += pl; } else if (g.hg < g.ag){ a.V++; h.D++; a.P += pw; h.P += pl; } else { h.E++; a.E++; h.P += pd; a.P += pd; }
    g.cards.forEach(cd => { if (m[cd.team]) m[cd.team].CP += cd.type === 'y' ? 1 : 3; });
  });
  const tb = c.rules.tiebreak || [];
  return Object.values(m).sort((x, y) => {
    if (y.P !== x.P) return y.P - x.P;
    for (const k of tb){
      let d = 0;
      if (k === 'v') d = y.V - x.V;
      else if (k === 'sg') d = (y.GP - y.GC) - (x.GP - x.GC);
      else if (k === 'gp') d = y.GP - x.GP;
      else if (k === 'cd') d = h2h(c, games, y.t.id, x.t.id);
      else if (k === 'cards') d = x.CP - y.CP;
      else if (k === 'sorteio') d = hash(x.t.id) % 997 - hash(y.t.id) % 997;
      if (d) return d;
    }
    return x.t.name.localeCompare(y.t.name);
  });
}
function tables(c){
  if (c.format === 'pontos') return [{title: null, rows: standingsFor(c, c.games, c.teams), q: 0}];
  if (c.format === 'grupos') return groupLetters(c).map(g => ({title:`Grupo ${g}`, q: c.rules.qualify,
    rows: standingsFor(c, c.games.filter(x => x.stage === 'grupo' && x.group === g), c.teams.filter(t => t.group === g))}));

}
function srcTeam(c, src){

  if (src.type === 'grp'){
    const gg = c.games.filter(g => g.stage === 'grupo' && g.group === src.g);
    if (!gg.length || !gg.every(isDecided)) return null;
    return standingsFor(c, gg, c.teams.filter(t => t.group === src.g))[src.pos - 1]?.t.id || null;
  }
  if (src.type === 'win'){ const g = c.games.find(x => x.id === src.game); return g && isDecided(g) ? winner(g) : null; }
  return null;
}
function srcLabel(c, src){

  if (src.type === 'grp') return `${src.pos}º Grupo ${src.g}`;
  if (src.type === 'win') return `Venc. ${c.games.find(x => x.id === src.game)?.name || ''}`;

}
function resolveKO(c){
  c.games.filter(g => g.stage === 'ko').sort((a, b) => a.seq - b.seq).forEach(g => {
    const h = srcTeam(c, g.srcH), a = srcTeam(c, g.srcA);
    if (g.home !== h || g.away !== a){ g.home = h; g.away = a; if (g.hg !== null || g.live) clearRes(g); }

function champion(c){

function discipline(c){
  const lim = c.rules.yellow || 3, susp = {}, yel = {}, pend = {}, tot = {};
  ordered(c).forEach(g => {
    if (!g.home || !g.away) return;
    susp[g.id] = [];
    [g.home, g.away].forEach(tid => team(c, tid).players.forEach(p => { if (pend[p.id]){ susp[g.id].push(p.id); pend[p.id] = false; } }));
    if (!isDecided(g)) return;
    g.cards.forEach(cd => {
      tot[cd.player] = tot[cd.player] || {y: 0, r: 0, team: cd.team};
      if (cd.type === 'y'){ tot[cd.player].y++; yel[cd.player] = (yel[cd.player] || 0) + 1; if (yel[cd.player] >= lim){ pend[cd.player] = true; yel[cd.player] = 0; } }
      else { tot[cd.player].r++; pend[cd.player] = true; }
    });
  });
  return {susp, yel, pend, tot};
}

  if (!best) return null; const pn = playerName(c, best[0]); return pn ? {...pn, votes: best[1], total: Object.values(v).reduce((a, b) => a + b, 0)} : null;
}

  return {insc, inscPend, inscOpen, spons, exp, saldo: insc + spons - exp, previsto: insc + inscPend + inscOpen + spons - exp};
}

function simulate(c, g){
  const sp = SP(c);
  if (sp.unit === 'pontos'){
    g.hg = 0; g.ag = 0;
    [g.home, g.away].forEach(tid => { const t = team(c, tid); let tot = 0;
      t.players.forEach(p => { const v = 2 * Math.floor(rnd() * 8) + (rnd() < .4 ? 3 : 0); if (v){ g.scorers.push({player: p.id, team: tid, goals: v}); tot += v; } });
      tid === g.home ? g.hg = tot : g.ag = tot; });
    if (g.hg === g.ag){ g.hg += 2; g.scorers[0].goals += 2; }
    return;
  }
  g.hg = Math.floor(rnd() * 5); g.ag = Math.floor(rnd() * 4);
  const add = (tid, n) => { const t = team(c, tid);
    for (let k = 0; k < n; k++){ const p = t.players[Math.floor(rnd() * t.players.length)];
      const ex = g.scorers.find(s => s.player === p.id); ex ? ex.goals++ : g.scorers.push({player: p.id, team: tid, goals: 1}); } };
  add(g.home, g.hg); add(g.away, g.ag);
  if (sp.cards) [g.home, g.away].forEach(tid => { const t = team(c, tid); if (rnd() < .75){ const p = t.players[Math.floor(rnd() * t.players.length)]; g.cards.push({player: p.id, team: tid, type: 'y'}); } });
}

const dot = (t, cls = '') => t && !t.open
  ? `<span class="dot ${cls}" style="background:${t.color}">${t.logo ? `<img src="${t.logo}" alt="">` : esc(t.short.slice(0,3))}</span>`
  : `<span class="dot ${cls}" style="background:#2b3d33;color:#8fa89a">?</span>`;
const avatar = (p, cls = '') => `<span class="avatarp ${cls}">${p.photo && p.consent !== false && !cur()?.minors ? `<img src="${p.photo}" alt="">` : esc(initials(p.name))}</span>`;
const arenaLogo = (o, size) => `<div class="logo" style="background:${o.color}${size ? `;width:${size}px;height:${size}px` : ''}">${o.logo ? `<img src="${o.logo}" alt="">` : esc((o.arena || APP_NAME)[0])}</div>`;
function sideName(c, g, side){
  const t = team(c, side === 'h' ? g.home : g.away);
  if (t) return {t, name: t.name, tbd: false};
  return {t: null, name: srcLabel(c, side === 'h' ? g.srcH : g.srcA), tbd: true};
}
function scoreHtml(c, g, click){
  if (g.live){ const s = liveScore(g); return `<div class="score lv">${s.h} × ${s.a}<small>${SP(c).sets ? 'ao vivo' : Math.floor(elapsed(g) / 60000) + "'"}</small></div>`; }
  if (g.hg === null) return `<div class="score pend">vs${click && g.home && g.away ? '<em>lançar</em>' : ''}</div>`;
  const pen = g.stage === 'ko' && g.hg === g.ag && g.ph !== null ? `<small>(${g.ph}×${g.pa} ${SP(c).tieLabel === 'Pênaltis' ? 'pên.' : 'desemp.'})</small>` : '';
  return `<div class="score">${g.hg} × ${g.ag}${pen}${g.wo ? '<small>W.O.</small>' : ''}</div>`;
}
function gameRow(c, g, click, disc){
  const h = sideName(c, g, 'h'), a = sideName(c, g, 'a');
  const sus = disc && !isDecided(g) ? (disc.susp[g.id] || []).length : 0;
  const hls = c.highlights.filter(x => x.game === g.id).length;
  const meta = g.postponed ? 'Adiado · a remarcar' : [g.date ? fmtDate(g.date) : '', g.time, g.field].filter(Boolean).join(' · ');
  return `<div class="game ${click ? 'click' : ''} ${g.live ? 'live' : ''}" ${click ? `data-act="result" data-id="${g.id}"` : ''}>
    <div class="gmeta">${g.live ? '<span class="tagx red"><span class="livedot"></span>AO VIVO</span>' : ''}
      ${g.group ? `<span class="tagx">Grupo ${g.group}</span>` : ''}${g.stage === 'ko' ? `<span class="tagx">${esc(g.name)}</span>` : ''}
      ${g.postponed ? '<span class="tagx y">Adiado</span>' : `<span>${esc(meta)}</span>`}
      ${sus ? `<span class="tagx red">${sus} suspenso${sus > 1 ? 's' : ''}</span>` : ''}${hls ? `<span class="tagx ok">🎬 ${hls}</span>` : ''}</div>
    <div class="gline">
      <div class="team ${h.tbd ? 'tbd' : ''}">${dot(h.t)}<span>${esc(h.name)}</span></div>${scoreHtml(c, g, click)}
      <div class="team r ${a.tbd ? 'tbd' : ''}"><span>${esc(a.name)}</span>${dot(a.t)}</div></div></div>`;
}
function gamesList(c, click, filter){
  const disc = discipline(c);
  return labels(c).map(l => {
    const gs = ordered(c).filter(g => g.label === l && (!filter || filter(g)));
    if (!gs.length) return '';
    const d = gs[0]?.date ? fmtDate(gs[0].date) : '';
    return `<div class="round-title"><span>${esc(l)}</span><span>${esc(d)}</span></div>` + gs.map(g => gameRow(c, g, click, disc)).join('');
  }).join('');
}
function classTables(c, pub){

    <tr><th>#</th><th class="t">Time</th><th>P</th><th>J</th><th>V</th>${sp.draws ? '<th>E</th>' : ''}<th>D</th><th>${sp.diff}</th></tr>

function bracketView(c, click){
  const ko = c.games.filter(g => g.stage === 'ko'); if (!ko.length) return '';

  <div class="bracket">${cols.map(l => `<div class="bcol"><h4>${esc(l)}</h4>${ordered(c).filter(g => g.label === l).map(g => {
    const h = sideName(c, g, 'h'), a = sideName(c, g, 'a'), w = isDecided(g) ? winner(g) : null, ls = g.live ? liveScore(g) : null;
    const sc = side => g.live ? (side === 'h' ? ls.h : ls.a) : g.hg === null ? '' : (side === 'h' ? g.hg : g.ag) + (g.hg === g.ag && g.ph !== null ? ` (${side === 'h' ? g.ph : g.pa})` : '');
    return `<div class="bmatch ${click ? 'click' : ''}" ${click ? `data-act="result" data-id="${g.id}"` : ''}>
      <div class="bteam ${h.tbd ? 'tbd' : ''} ${w && w === g.home ? 'win' : ''}">${dot(h.t)}<span>${esc(h.name)}</span><b>${sc('h')}</b></div>
      <div class="bteam ${a.tbd ? 'tbd' : ''} ${w && w === g.away ? 'win' : ''}">${dot(a.t)}<span>${esc(a.name)}</span><b>${sc('a')}</b></div>

function tableTab(c, click, pub){

/* ---------- estatísticas ---------- */
function statsView(c){
  const dec = c.games.filter(isDecided), sp = SP(c);
  if (!dec.length) return `<div class="card empty">As estatísticas aparecem depois do primeiro jogo.</div>`;
  const all = standingsFor(c, dec, c.teams.filter(t => !t.open)).filter(r => r.J > 0);
  const goals = dec.reduce((a, g) => a + g.hg + g.ag, 0);
  const atk = [...all].sort((a, b) => b.GP / b.J - a.GP / a.J)[0], def = [...all].sort((a, b) => a.GC / a.J - b.GC / b.J)[0];
  const big = [...dec].sort((a, b) => Math.abs(b.hg - b.ag) - Math.abs(a.hg - a.ag) || (b.hg + b.ag) - (a.hg + a.ag))[0];
  const fair = sp.cards ? [...all].sort((a, b) => a.CP / a.J - b.CP / b.J)[0] : null;
  const top = sp.scorers ? topScorers(c)[0] : null;
  const cqc = {}; playedLabels(c).forEach(l => { const k = craqueOf(c, l); if (k) cqc[k.p.id] = (cqc[k.p.id] || 0) + 1; });
  const cq = Object.entries(cqc).sort((a, b) => b[1] - a[1])[0], cqp = cq ? playerName(c, cq[0]) : null;
  const hl = [...c.highlights].sort((a, b) => b.likes - a.likes)[0];
  const u = sp.unit;
  return `<div class="sgrid">
    <div class="sbox"><small>${u[0].toUpperCase() + u.slice(1)}</small><b>${goals}</b><span>${(goals / dec.length).toFixed(1)} por jogo</span></div>
    <div class="sbox"><small>Jogos realizados</small><b>${dec.length}/${c.games.length}</b><span>${Math.round(dec.length / c.games.length * 100)}% do campeonato</span></div>
    <div class="sbox"><small>Melhor ataque</small><b>${esc(atk.t.name)}</b><span>${atk.GP} ${u} em ${atk.J} jogo${atk.J > 1 ? 's' : ''}</span></div>
    <div class="sbox"><small>Melhor defesa</small><b>${esc(def.t.name)}</b><span>${def.GC} sofridos em ${def.J} jogo${def.J > 1 ? 's' : ''}</span></div>
    <div class="sbox"><small>Maior diferença</small><b>${big.hg} × ${big.ag}</b><span>${esc(team(c, big.home).short)} × ${esc(team(c, big.away).short)}</span></div>
    ${fair ? `<div class="sbox"><small>Mais disciplinado</small><b>${esc(fair.t.name)}</b><span>${fair.CP} pts de cartão</span></div>` : `<div class="sbox"><small>Times</small><b>${all.length}</b><span>com jogos disputados</span></div>`}
  </div>
  <h2>Prêmios</h2>
  <div class="card">
    ${champion(c) ? `<div class="prize"><div class="pi">🏆</div><div><b>${esc(champion(c).name)}</b><span>Campeão</span></div></div>` : ''}
    ${sp.scorers ? `<div class="prize"><div class="pi">${sp.ball}</div><div><b>${top ? esc(pubName(top.p)) + ' · ' + top.goals + ' ' + (u === 'pontos' ? 'pts' : 'gols') : '—'}</b><span>${sp.unit === 'pontos' ? 'Cestinha' : 'Artilheiro'}${top ? ' · ' + esc(top.t.name) : ''}</span></div></div>` : ''}
    <div class="prize"><div class="pi">⭐</div><div><b>${cqp ? esc(pubName(cqp.p)) : '—'}</b><span>Craque do campeonato${cq ? ` · eleito em ${cq[1]} rodada${cq[1] > 1 ? 's' : ''}` : ' · votação dos jogadores'}</span></div></div>
    <div class="prize"><div class="pi">🧱</div><div><b>${esc(def.t.name)}</b><span>Melhor defesa</span></div></div>
    ${fair ? `<div class="prize"><div class="pi">🤝</div><div><b>${esc(fair.t.name)}</b><span>Troféu fair play</span></div></div>` : ''}
    ${hl ? `<div class="prize"><div class="pi">🎬</div><div><b>${esc(hl.title)}</b><span>Lance do campeonato · ${hl.likes} curtidas</span></div></div>` : ''}
  </div>`;
}

function tabDisc(c){
  const d = discipline(c), lim = c.rules.yellow, nextSusp = [];

  Object.keys(d.pend).filter(pid => d.pend[pid]).forEach(pid => { const pn = playerName(c, pid); if (pn) nextSusp.push({...pn, g: null}); });
  const rows = Object.entries(d.tot).map(([pid, v]) => ({...playerName(c, pid), ...v, acc: d.yel[pid] || 0})).filter(r => r.p).sort((a, b) => (b.r * 3 + b.y) - (a.r * 3 + a.y));
  return `<div class="card"><b>Regra atual</b><p class="sub" style="margin:4px 0 0">${lim} amarelos = 1 jogo de suspensão · vermelho = 1 jogo. Aplicada automaticamente no próximo jogo do time. Mude em Ajustes.</p></div>

  if (S.shareType === 'suspensos'){
    const d = discipline(c), list = [];

    waText = `🚫 Suspensos · ${c.name}\n` + list.map(s => `${s.p.name} (${s.t.short})`).join('\n');
  }
  if (S.shareType === 'campeao'){
    const top = sp.scorers ? topScorers(c)[0] : null;
    inner = `<div class="trophy">🏆</div><div class="s-sec" style="text-align:center">Campeão</div><div class="bigname">${esc(ch.name)}</div>
      <div style="margin-top:22px">${top ? `<div class="s-game" style="grid-template-columns:1fr auto"><span>${sp.ball} ${sp.unit === 'pontos' ? 'Cestinha' : 'Artilheiro'}: ${esc(pubName(top.p))}</span><span class="sc">${top.goals}</span></div>` : ''}</div>`;

  ${picker}
  ${inner === null ? `<div class="card empty">${S.shareType === 'rodada' ? 'Lance o resultado de pelo menos um jogo para gerar a arte.' : 'Nenhum jogo marcado com os dois times definidos.'}</div>` : shareFrame(c, inner) + `
  <div class="grid2" style="margin-top:12px">
    <button class="btn" data-act="download">⬇️ Baixar imagem</button>
    <a class="btn wa" href="${waLink('', waText + `\nhttps://${DOMAIN}/c/${slug(c.name)}`)}" target="_blank" rel="noopener">Enviar no WhatsApp</a></div>`}
  <h2>Imprimir e exportar</h2>

/* ---------- súmula ao vivo (organizador ou mesário) ---------- */
function viewSumula(c, g){
  const sp = SP(c), d = discipline(c), sus = new Set(d.susp[g.id] || []), s = liveScore(g), h = team(c, g.home), a = team(c, g.away);
  const side = t => {
    if (sp.sets) return `<div class="card" style="margin-top:10px"><div class="row" style="padding-top:0">${dot(t)}<div class="grow"><b>${esc(t.name)}</b><span>${esc(t.players.map(p => p.name).join(' · '))}</span></div>
      <button class="btn sm" data-act="ev" data-id="goal|team|${t.id}|1">＋ 1 ${sp.unit === 'mapas' ? 'mapa' : 'set'}</button></div></div>`;
    return `<div class="card" style="margin-top:10px"><div class="row" style="padding-top:0">${dot(t)}<div class="grow"><b>${esc(t.name)}</b></div></div>
    ${t.players.map(p => { const off = sus.has(p.id);
      const y = g.events.filter(e => e.player === p.id && e.type === 'y').length, r = g.events.some(e => e.player === p.id && e.type === 'r');
      const gl = g.events.filter(e => e.player === p.id && e.type === 'goal').reduce((x, e) => x + (e.v || 1), 0);
      const scoreBtns = sp.steps.map(v => `<button class="evbtn" ${off || r ? 'disabled' : ''} data-act="ev" data-id="goal|${p.id}|${t.id}|${v}">${sp.steps.length > 1 ? '+' + v : sp.ball}</button>`).join('');
      return `<div class="prow"><span class="pn">${p.num !== '' ? `<b style="color:var(--muted)">${esc(p.num)}</b> ` : ''}${esc(p.name)} ${gl ? (sp.steps.length > 1 ? `<b>${gl} pts</b>` : sp.ball.repeat(gl)) : ''}${y ? ' 🟨'.repeat(y) : ''}${r ? ' 🟥' : ''}${off ? '<em>SUSPENSO</em>' : ''}</span>
        <div class="pctl">${scoreBtns}${sp.cards ? `<button class="evbtn" ${off || r ? 'disabled' : ''} data-act="ev" data-id="y|${p.id}|${t.id}|0">🟨</button><button class="evbtn" ${off || r ? 'disabled' : ''} data-act="ev" data-id="r|${p.id}|${t.id}|0">🟥</button>` : ''}</div></div>`; }).join('') || '<div class="sub">Sem jogadores cadastrados.</div>'}
    ${sp.unit === 'gols' ? `<div class="actions"><button class="btn ghost sm" data-act="ev" data-id="goal|og|${t.id}|1">${sp.ball} Gol contra a favor</button></div>` : ''}</div>`;
  };
  const pname = e => e.player === 'og' ? 'Gol contra' : e.player === 'team' ? (sp.unit === 'mapas' ? 'Mapa' : 'Set') : (playerName(c, e.player)?.p.name || '');
  const icon = e => e.type === 'goal' ? (e.player === 'team' ? '✅' : sp.steps.length > 1 ? `+${e.v}` : sp.ball) : e.type === 'y' ? '🟨' : '🟥';
  const tie = g.stage === 'ko' && s.h === s.a, ref = staff(g.ref), mes = staff(g.mes);
  return `<div class="livebox">
    <div class="gmeta" style="justify-content:center"><span class="tagx red"><span class="livedot"></span>AO VIVO</span><span>${esc(g.stage === 'ko' ? g.name : g.label)} · ${esc(g.field)}</span></div>
    <div class="clock" id="clock">${fmtClock(elapsed(g))}</div>
    <div class="lscore"><div class="n">${dot(h)}${esc(h.name)}</div><div class="big">${s.h} × ${s.a}</div><div class="n">${dot(a)}${esc(a.name)}</div></div>
    <div class="grid2"><button class="btn ${g.clock.run ? 'ghost' : ''}" data-act="clock">${g.clock.run ? '⏸ Pausar' : g.clock.acc ? '▶ Retomar' : '▶ Iniciar'}</button>
      <button class="btn ghost" data-act="evundo" ${g.events.length ? '' : 'disabled'}>↩ Desfazer</button></div>
    ${ref || mes ? `<div class="gmeta" style="justify-content:center;margin:10px 0 0">${ref ? `🧑‍⚖️ ${esc(ref.name)}` : ''}${mes ? ` · 📝 ${esc(mes.name)}` : ''}</div>` : ''}
  </div>
  ${side(h)}${side(a)}
  <h2>Lances</h2>
  <div class="card timeline">${g.events.length ? [...g.events].reverse().map(e => `<div class="ev"><b>${sp.sets ? '' : e.min + "'"}</b><span>${icon(e)}</span><span>${esc(pname(e))} · ${esc(team(c, e.team).short)}</span></div>`).join('') : '<div class="empty">Nenhum lance ainda.</div>'}</div>
  ${S.livePen && tie ? `<div class="card pens" style="margin-top:14px"><b>Empate no mata-mata: ${esc((sp.tieLabel || 'desempate').toLowerCase())}</b><div class="grid2" style="margin-top:8px"><input class="inp" type="number" id="lph" min="0" placeholder="${esc(h.short)}"><input class="inp" type="number" id="lpa" min="0" placeholder="${esc(a.short)}"></div></div>` : ''}
  <div style="margin-top:14px"><button class="btn block live" data-act="endlive">Encerrar e salvar súmula</button></div>
  ${S.mesario ? `<div style="margin-top:10px"><button class="btn ghost block" data-act="exitmes">Sair do modo mesário</button></div><div class="note">Modo mesário: este acesso só permite lançar a súmula deste jogo. O painel do organizador fica protegido.</div>`
    : `<div class="note">A página pública mostra o placar ao vivo enquanto a súmula está aberta.</div>`}`;
}

function viewSignup(){

      <div style="margin-top:14px"><button class="btn block" data-act="wljoin">Entrar na lista de espera</button></div></div>`;
  }
  if (st === 1) return head + `<div class="card">
    <label style="margin-top:0">Nome do ${sp.who === 'Dupla' ? 'dupla' : 'time'}</label><input class="inp" id="sname" value="${esc(d.name)}" placeholder="${sp.who === 'Dupla' ? 'Ex.: Ana & Bia' : 'Ex.: Resenha FC'}">

    <label>WhatsApp do capitão</label><input class="inp" id="sphone" inputmode="tel" value="${esc(d.phone)}" placeholder="(11) 99999-9999">
    <label>${sp.who} (um por linha: número, nome e WhatsApp, os dois últimos opcionais)</label><textarea class="inp" id="splayers" placeholder="${sp.who === 'Dupla' ? 'Ana 11988887777\nBia' : '10 João 11988887777\n7 Pedro\nCarlos 11977776666'}">${esc(d.players)}</textarea>
    <p class="sub" style="margin:6px 0 0;font-size:12px">Com o WhatsApp, cada atleta encontra o campeonato na área do atleta. O número nunca aparece na página pública.</p>
    <label class="check"><input type="checkbox" id="sconsent" ${d.consent !== false ? 'checked' : ''}> Os atletas autorizam exibir nome, foto e estatísticas na página do campeonato</label>
    ${c.minors ? '<div class="note">Campeonato com menores de idade: a página é privada e mostra só o primeiro nome, sem fotos.</div>' : ''}

function craqueResults(c){

const LEADS = {1440:'1 dia antes', 180:'3 horas antes', 60:'1 hora antes', 30:'30 min antes'};
const gameTime = g => g.date && g.time ? new Date(`${g.date}T${g.time}:00`) : null;

}
function alertText(c, g, t){
  const o = team(c, g.home === t.id ? g.away : g.home), d = discipline(c), sus = (d.susp[g.id] || []).map(pid => playerName(c, pid)).filter(x => x && x.t.id === t.id).map(x => x.p.name);
  return `⏰ Lembrete de jogo · ${c.name}\n${t.name} × ${o?.name || 'a definir'}\n📅 ${fmtLong(g.date)} às ${g.time}${g.field ? ' · ' + g.field : ''}${c.location ? '\n📍 ' + c.location + (c.city ? ', ' + c.city : '') : ''}${sus.length ? '\n🚫 Suspensos: ' + sus.join(', ') : ''}\nChegue 15 min antes! https://${DOMAIN}/c/${slug(c.name)}`;
}
function myAlerts(){
  const ph = S.athlete?.phone, pref = S.athlete?.alerts || {on: true, leads: [1440, 60]}, out = [];
  if (!pref.on) return out;
  myChamps().forEach(c => {
    if (!c.alerts.on) return;
    const t = myTeam(c, ph);
    ordered(c).filter(g => !isDecided(g) && !g.live && !g.postponed && g.home && g.away && (g.home === t.id || g.away === t.id)).forEach(g => {
      const gt = gameTime(g); if (!gt) return;
      pref.leads.forEach(m => {
        const at = new Date(gt - m * 60000);
        if (gt > Date.now()) out.push({c, g, t, m, at, past: at < Date.now()});
      });
    });
  });
  return out.sort((a, b) => a.at - b.at);
}
const fmtWhen = d => d.toLocaleString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}).replace('.', '');
function athleteAlerts(){
  const pref = S.athlete.alerts = S.athlete.alerts || {on: true, leads: [1440, 60], push: false};
  const list = myAlerts().filter(x => !x.past).slice(0, 4);
  return `<h2>🔔 Alertas antes do jogo</h2>
  <div class="card">

}

function fakeQr(){
  let s = 97; const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  return `<div class="qr">${Array.from({length: 441}, (_, i) => {
    const x = i % 21, y = Math.floor(i / 21), fin = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const ax = x >= 14 ? x - 14 : x, ay = y >= 14 ? y - 14 : y;
    const on = fin ? (ax === 0 || ax === 6 || ay === 0 || ay === 6 || (ax >= 2 && ax <= 4 && ay >= 2 && ay <= 4)) : r() > .52;
    return `<i style="background:${on ? '#0b1410' : '#fff'}"></i>`; }).join('')}</div>`;
}

const ownChamps = () => S.champs.filter(c => !c.external);
const ownFields = () => [...new Set(ownChamps().flatMap(c => c.sched.fields).concat(S.org.bookings.map(b => b.field)))];
function slotItems(date, time, field){
  const games = []; ownChamps().forEach(c => c.games.forEach(g => { if (!g.postponed && g.date === date && g.time === time && g.field === field) games.push({c, g}); }));
  return {games, books: S.org.bookings.filter(b => b.date === date && b.time === time && b.field === field)};
}
function slotConflict(date, time, field, gid){
  if (!date || !time || !field) return null;
  const b = S.org.bookings.find(x => x.date === date && x.time === time && x.field === field);
  if (b) return `alugado para ${b.who}`;
  for (const c of ownChamps()) for (const g of c.games)
    if (g.id !== gid && !g.postponed && g.date === date && g.time === time && g.field === field) return `ocupado por ${team(c, g.home)?.short || '?'} × ${team(c, g.away)?.short || '?'} (${c.name})`;
  return null;
}
function agendaDates(){
  return [...new Set(ownChamps().flatMap(c => c.games.map(g => g.date)).concat(S.org.bookings.map(b => b.date)).filter(d => d && d >= today()))].sort().slice(0, 8);
}
function viewAgenda(){
  const dates = agendaDates();
  if (!S.agDate) S.agDate = dates[0] || today();
  const fields = ownFields(), hours = [];
  for (let h = 7; h <= 22; h++) hours.push(String(h).padStart(2, '0') + ':00');
  let conflicts = 0, used = 0;
  const cells = hours.map(h => `<div class="tm">${h}</div>` + fields.map(f => {
    const {games, books} = slotItems(S.agDate, h, f), n = games.length + books.length;
    if (!n) return `<div class="slot free" data-act="agbook" data-id="${h}|${esc(f)}">+</div>`;
    used++; if (n > 1) conflicts++;
    return `<div class="slot ${n > 1 ? 'conf' : games.length ? 'game' : 'book'}" ${books.length && !games.length ? `data-act="agdel" data-id="${books[0].id}"` : ''}>
      ${games.map(x => `<b>${esc(team(x.c, x.g.home)?.short || '?')}×${esc(team(x.c, x.g.away)?.short || '?')}</b><br><small>${esc(x.c.name.split(' ').slice(0, 2).join(' '))}</small>`).join('<br>')}
      ${books.map(b => `${games.length ? '<br>' : ''}🔵 ${esc(b.who)}`).join('')}</div>`;
  }).join('')).join('');
  return `<h1>Agenda de quadras</h1><p class="sub">Jogos dos campeonatos e aluguéis avulsos na mesma grade. Toque num horário livre para reservar.</p>
  <div style="display:flex;gap:8px;margin-bottom:10px"><input type="date" class="inp" id="agdate" value="${esc(S.agDate)}"><button class="btn ghost" data-act="agday" data-id="${today()}">Hoje</button></div>
  <div class="chips">${dates.map(d => `<button class="chip ${d === S.agDate ? 'on' : ''}" data-act="agday" data-id="${d}">${esc(fmtDate(d))}</button>`).join('')}</div>
  <div class="stats"><div class="stat"><b>${used}</b><span>horários ocupados</span></div><div class="stat"><b>${S.org.bookings.filter(b => b.date === S.agDate).length}</b><span>aluguéis avulsos</span></div><div class="stat"><b style="color:${conflicts ? 'var(--danger)' : 'inherit'}">${conflicts}</b><span>conflitos</span></div></div>
  <div style="display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap"><span>🟩 Jogo de campeonato</span><span>🟦 Aluguel avulso</span><span>🟥 Conflito</span></div>
  ${fields.length ? `<div class="agrid" style="grid-template-columns:44px repeat(${fields.length},1fr)"><div></div>${fields.map(f => `<div class="h">${esc(f)}</div>`).join('')}${cells}</div>` : '<div class="card empty">Cadastre campos ou quadras num campeonato para usar a agenda.</div>'}

/* =========================================================
   Ranking geral da arena
   ========================================================= */
const pKey = (p, t) => digits(p.phone).length >= 10 ? digits(p.phone) : slug(p.name) + '|' + slug(t.name);
function arenaRanking(){
  const P = {}, T = {};
  ownChamps().forEach(c => {
    const sp = SP(c), ch = champion(c);
    c.teams.filter(t => !t.open).forEach(t => {
      const tk = slug(t.name);
      T[tk] = T[tk] || {name: t.name, t, titles: 0, wins: 0, games: 0, champs: 0}; T[tk].champs++;
      if (ch && ch.id === t.id) T[tk].titles++;
      t.players.forEach(p => {
        const k = pKey(p, t);
        P[k] = P[k] || {name: p.name, p, team: t.name, teams: new Set(), goals: 0, points: 0, craque: 0, titles: 0, champs: 0, hide: false};
        P[k].champs++; P[k].teams.add(t.name); if (ch && ch.id === t.id) P[k].titles++;
        if (c.minors || p.hidden || p.consent === false) P[k].hide = true;
      });
    });
    standingsFor(c, c.games, c.teams).forEach(r => { const x = T[slug(r.t.name)]; if (x){ x.wins += r.V; x.games += r.J; } });
    topScorers(c).forEach(s => { const x = P[pKey(s.p, s.t)]; if (!x) return; if (sp.unit === 'pontos') x.points += s.goals; else if (sp.unit === 'gols') x.goals += s.goals; });
    playedLabels(c).forEach(l => { const k = craqueOf(c, l); if (k){ const x = P[pKey(k.p, k.t)]; if (x) x.craque++; } });
  });
  return {P: Object.values(P).filter(x => !x.hide), T: Object.values(T)};
}
function viewRanking(){
  const {P, T} = arenaRanking(), o = S.org, year = today().slice(0, 4);
  const tabs = [['gols','Artilheiros ⚽'],['craque','Craques ⭐'], ...(P.some(x => x.points) ? [['pontos','Cestinhas 🏀']] : []),['times','Times 🏆']];
  if (!tabs.some(t => t[0] === S.rkTab)) S.rkTab = 'gols';
  const plist = (val, lab) => { const arr = P.filter(x => val(x) > 0).sort((a, b) => val(b) - val(a) || b.titles - a.titles).slice(0, 10);
    return arr.length ? arr.map((x, i) => `<div class="row"><div class="rank ${i === 0 ? 'g' : ''}">${i + 1}</div>${avatar(x.p)}<div class="grow"><b>${esc(x.name)}</b><span>${esc([...x.teams].join(', '))} · ${x.champs} campeonato${x.champs > 1 ? 's' : ''}${x.titles ? ` · ${x.titles} título${x.titles > 1 ? 's' : ''} 🏆` : ''}</span></div><b>${val(x)} ${val(x) === 1 && lab === 'gols' ? 'gol' : lab}</b></div>`).join('') : '<div class="empty">Ainda sem dados.</div>'; };
  let body = '', lead = null;
  if (S.rkTab === 'gols'){ body = plist(x => x.goals, 'gols'); lead = [...P].sort((a, b) => b.goals - a.goals)[0]; }
  if (S.rkTab === 'craque') body = plist(x => x.craque, '⭐');
  if (S.rkTab === 'pontos') body = plist(x => x.points, 'pts');
  if (S.rkTab === 'times'){
    const arr = [...T].sort((a, b) => b.titles - a.titles || b.wins - a.wins).slice(0, 10);
    body = arr.map((x, i) => `<div class="row"><div class="rank ${i === 0 ? 'g' : ''}">${i + 1}</div>${dot(x.t)}<div class="grow"><b>${esc(x.name)}</b><span>${x.wins} vitória${x.wins === 1 ? '' : 's'} em ${x.games} jogo${x.games === 1 ? '' : 's'} · ${x.champs} campeonato${x.champs > 1 ? 's' : ''}</span></div><b>${x.titles ? x.titles + ' 🏆' : ''}</b></div>`).join('');
  }
  return `<div class="hero" style="background:radial-gradient(120% 120% at 0% 0%,${hexA(o.color, .45)} 0%,var(--panel) 60%)">
    <div class="arena">${arenaLogo(o)}${esc(o.arena)}</div><div class="tag">Ranking ${year}</div><h1>Os melhores da arena</h1>
    <p class="sub" style="margin:4px 0 0">Soma todos os campeonatos do ano. Atletas com perfil oculto ou de campeonatos com menores não aparecem.</p></div>
  ${lead && lead.goals ? `<div class="champion" style="text-align:left;display:flex;gap:12px;align-items:center">${avatar(lead.p, 'lg')}<div><span class="sub" style="margin:0">⚽ Artilheiro do ano até agora</span><b>${esc(lead.name)}</b><span class="sub" style="margin:0">${lead.goals} gols · ${esc([...lead.teams].join(', '))}</span></div></div>` : ''}
  <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.rkTab === k ? 'on' : ''}" data-act="rktab" data-id="${k}">${l}</button>`).join('')}</div>
  <div class="card">${body}</div>`;
}

   Palpites (sem dinheiro)
   ========================================================= */
const guessKey = () => S.athlete ? 'a' + digits(S.athlete.phone) : S.guest ? 'g' + slug(S.guest) : null;
const guessName = () => S.athlete ? S.athlete.name : S.guest;
function guessPts(g, x){ if (!isDecided(g)) return null; if (+x.h === g.hg && +x.a === g.ag) return 3; return Math.sign(x.h - x.a) === Math.sign(g.hg - g.ag) ? 1 : 0; }
function guessBoard(c){
  const B = {};
  Object.entries(c.guesses).forEach(([gid, m]) => { const g = c.games.find(x => x.id === gid); if (!g || !isDecided(g)) return;
    Object.entries(m).forEach(([k, x]) => { B[k] = B[k] || {name: x.name, pts: 0, exact: 0, n: 0}; const p = guessPts(g, x); B[k].pts += p; B[k].n++; if (p === 3) B[k].exact++; }); });
  return Object.entries(B).map(([k, v]) => ({k, ...v})).sort((a, b) => b.pts - a.pts || b.exact - a.exact || a.name.localeCompare(b.name));
}
function guessView(c){
  const k = guessKey(), board = guessBoard(c);
  const up = ordered(c).filter(g => !isDecided(g) && !g.live && g.home && g.away && !g.postponed).slice(0, 6);
  const past = ordered(c).filter(g => isDecided(g) && k && c.guesses[g.id]?.[k]).slice(-3).reverse();
  return `<div class="card" style="margin-bottom:12px"><b>🎯 Palpites só por diversão</b><p class="sub" style="margin:4px 0 0">Placar exato vale 3 pontos. Acertar só o vencedor (ou o empate) vale 1. Sem dinheiro e sem apostas.</p></div>
  ${!k ? `<div class="card"><label style="margin-top:0">Seu apelido no ranking</label><div style="display:flex;gap:8px"><input class="inp" id="gname" placeholder="Ex.: Zé da Resenha"><button class="btn" data-act="gjoin">Entrar</button></div>
    <p class="sub" style="margin:8px 0 0;font-size:12px">Ou entre na área do atleta para palpitar com o seu nome.</p></div>` : `<p class="sub">Palpitando como <b style="color:var(--text)">${esc(guessName())}</b></p>`}
  <h2>Próximos jogos</h2>
  ${up.length ? up.map(g => { const h = team(c, g.home), a = team(c, g.away), mine = k && c.guesses[g.id]?.[k], n = Object.keys(c.guesses[g.id] || {}).length;
    return `<div class="card" style="padding:10px 12px;margin-top:8px"><div class="gmeta">${esc(g.stage === 'ko' ? g.name : g.label)} · ${esc(fmtDate(g.date))} ${esc(g.time)} · ${n} palpite${n === 1 ? '' : 's'}</div>
      <div class="guess"><div class="team">${dot(h)}<span>${esc(h.short)}</span></div><input class="inp" type="number" min="0" id="gh_${g.id}" value="${mine ? mine.h : ''}" ${k ? '' : 'disabled'}>
        <span style="text-align:center;color:var(--muted)">×</span><input class="inp" type="number" min="0" id="ga_${g.id}" value="${mine ? mine.a : ''}" ${k ? '' : 'disabled'}><div class="team r"><span>${esc(a.short)}</span>${dot(a)}</div></div>
      ${k ? `<div class="actions" style="justify-content:flex-end"><button class="btn sm ${mine ? 'ghost' : ''}" data-act="gsave" data-id="${g.id}">${mine ? '✓ Atualizar palpite' : 'Palpitar'}</button></div>` : ''}</div>`; }).join('')
    : '<div class="card empty">Nenhum jogo marcado para palpitar.</div>'}
  ${past.length ? `<h2>Seus últimos palpites</h2><div class="card">${past.map(g => { const x = c.guesses[g.id][k], p = guessPts(g, x); return `<div class="row"><div class="grow"><b>${esc(team(c, g.home).short)} ${g.hg} × ${g.ag} ${esc(team(c, g.away).short)}</b><span>Seu palpite: ${x.h} × ${x.a}</span></div><span class="badge ${p === 3 ? 'ok' : p ? 'wait' : 'open'}">+${p}</span></div>`; }).join('')}</div>` : ''}
  <h2>Ranking dos palpiteiros</h2>
  <div class="card">${board.length ? board.slice(0, 10).map((r, i) => `<div class="row"><div class="rank ${i === 0 ? 'g' : ''}">${i + 1}</div><div class="grow"><b>${esc(r.name)}${r.k === k ? ' (você)' : ''}</b><span>${r.exact} placar${r.exact === 1 ? '' : 'es'} exato${r.exact === 1 ? '' : 's'} · ${r.n} palpite${r.n === 1 ? '' : 's'}</span></div><b>${r.pts} pts</b></div>`).join('') : '<div class="empty">O ranking aparece depois dos primeiros jogos.</div>'}</div>`;
}

function parsePlayers(text, consent = true){
  return String(text).split('\n').map(x => x.trim()).filter(Boolean).map(line => {
    const parts = line.split(/\s+/); let num = '', phone = '';
    if (/^\d{1,3}$/.test(parts[0]) && parts.length > 1) num = parts.shift();
    let name = parts.join(' ');
    const m = name.match(/^(.*?)[\s,;-]*((?:\+?55)?\s?\(?\d{2}\)?\s?9?\d{4}[-\s]?\d{4})$/);
    if (m && m[1].trim() && digits(m[2]).length >= 10){ name = m[1].trim(); phone = m[2]; }
    return {id: uid(), name, num, phone, photo: null, hidden: false, consent};
  });
}
