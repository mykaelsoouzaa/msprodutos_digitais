      }
      g.hg = s.h; g.ag = s.a; g.scorers = []; g.cards = [];
      g.events.forEach(ev => {
        if (ev.type === 'goal'){ if (ev.player === 'og' || ev.player === 'team') return; const ex = g.scorers.find(x => x.player === ev.player); ex ? ex.goals += (ev.v || 1) : g.scorers.push({player: ev.player, team: ev.team, goals: ev.v || 1}); }
        else g.cards.push({player: ev.player, team: ev.team, type: ev.type});
      });
      if (g.clock.run){ g.clock.acc += Date.now() - g.clock.t0; g.clock.run = false; }
      g.live = false; S.livePen = false;
      if (S.mesario){ S.mesario = null; S.screen = 'champ'; S.tab = 'jogos'; resolveKO(c); toast('Súmula enviada ao organizador ✓'); break; }
      S.screen = 'champ'; S.tab = 'jogos'; applyResult(c, g); break;
    }

    /* novo campeonato */
    case 'new': if (!isPro() && activeOwn() >= FREE_MAX_CHAMPS){ needPro(null, `Ter mais de ${FREE_MAX_CHAMPS} campeonatos ativos`); return; }
      S.draft = {city: S.org.city || 'São Paulo, SP', visibility:'link', minors:false, name:'', sport:'Futebol society', format:'grupos', n: 8, fee: 300, location: S.org.arena || '', start: nextSaturday(), yellow: 3, times:'09:00, 10:00', fields:'Campo 1, Campo 2'}; S.modal = {type:'new'}; break;
    case 'nformat': S.draft.format = id; break;
    case 'create': {
      const d = S.draft, n = parseInt(d.n) || 0;
      if (!String(d.name).trim()){ toast('Dê um nome ao campeonato'); render(); return; }
      if (d.format === 'mata' && ![4, 8, 16].includes(n)){ toast('Mata-mata precisa de 4, 8 ou 16 times'); render(); return; }
      if (d.format === 'grupos' && (n < 6 || n > 16)){ toast('Grupos + mata-mata: de 6 a 16 times'); render(); return; }
      if (d.format === 'pontos' && (n < 3 || n > 16)){ toast('Pontos corridos: de 3 a 16 times'); render(); return; }
      if (n > FREE_MAX_TEAMS && !isPro()){ needPro(null, `Campeonato com mais de ${FREE_MAX_TEAMS} times`); return; }
      const times = splitList(d.times), fields = splitList(d.fields);
      const ch = makeChamp({name: String(d.name).trim(), sport: d.sport, fee: Math.max(0, +d.fee || 0), format: d.format, n,
        location: d.location, yellow: Math.max(1, parseInt(d.yellow) || 3), start: d.start || nextSaturday(), visibility: d.visibility, minors: d.minors, city: (d.city || '').trim() || S.org.city || '',
        times: times.length ? times : ['09:00'], fields: fields.length ? fields : ['Campo 1']});
      S.champs.unshift(ch); S.cur = ch.id; S.screen = 'champ'; S.tab = 'times'; S.modal = null; S.draft = null;
      toast('Campeonato criado · agora mande o link de inscrição'); break;
    }

    /* times */
    case 'editteam': {
      const t = team(c, id);
      S.draft = {id, name: t.open ? '' : t.name, short: t.open ? '' : t.short, color: t.color, logo: t.logo, cap: t.captain.name, phone: t.captain.phone, paid: t.paid, open: t.open,
        players: t.players.map(p => ({...p}))};
      S.modal = {type:'team', id}; break;
    }
    case 'tcolor': S.draft.color = id; break;
    case 'tlogorm': S.draft.logo = null; break;
    case 'padd': S.draft.players.push({id: uid(), name:'', num:'', photo:null}); break;
    case 'pdel': S.draft.players.splice(+id, 1); break;
    case 'saveteam': {
      const d = S.draft, t = team(c, d.id);
      if (!d.name.trim()){ toast('Digite o nome'); render(); return; }
      t.name = d.name.trim(); t.short = (d.short.trim() || d.name.replace(/[^A-Za-zÀ-ú]/g, '').slice(0, 3)).toUpperCase().slice(0, 3);
      t.color = d.color; t.logo = d.logo; t.captain = {name: d.cap, phone: d.phone}; t.paid = d.paid; t.open = false;
      t.players = d.players.filter(p => p.name.trim()).map(p => ({...p, name: p.name.trim()}));
      S.modal = null; S.draft = null; resolveKO(c); toast('Time atualizado'); break;
    }

    /* ajustes do campeonato */
    case 'savecfg': {
      c.name = val('cname') || c.name; c.location = val('cloc') || ''; c.city = (val('ccity') || '').trim(); c.fee = Math.max(0, +val('cfee') || 0);
      if (val('cyel') !== undefined) c.rules.yellow = Math.max(1, parseInt(val('cyel')) || 3);
      const q = parseInt(val('cqual'));
      if (c.format === 'grupos' && q && q !== c.rules.qualify){
        const old = c.rules.qualify; c.rules.qualify = q;
        if (!rebuildKO(c)){ c.rules.qualify = old; toast('O mata-mata já começou: não dá para mudar os classificados'); break; }
        toast(`Mata-mata refeito com ${q} por grupo`); break;
      }
      toast('Ajustes salvos'); break;
    }
    case 'tb': { const [i, dlt] = id.split('|').map(Number), tb = c.rules.tiebreak, j = i + dlt; [tb[i], tb[j]] = [tb[j], tb[i]]; resolveKO(c); break; }
    case 'resched': {
      const times = splitList(val('ctimes')), fields = splitList(val('cfields'));
      c.sched = {start: val('cstart') || c.sched.start, times: times.length ? times : c.sched.times, fields: fields.length ? fields : c.sched.fields};
      schedule(c, false); toast('Agenda reorganizada'); break;
    }
    case 'spadd': {
      if (needPro(c, 'Cadastrar patrocinadores')) return;
      const n = (val('spname') || '').trim(); if (!n){ toast('Digite o nome do patrocinador'); return; }
      c.sponsors.push({id: uid(), name: n, value: Math.max(0, +val('spvalue') || 0), link: (val('splink') || '').trim(), logo: S.spLogo}); S.spLogo = null; toast('Patrocinador adicionado'); break;
    }
    case 'spdel': c.sponsors = c.sponsors.filter(s => s.id !== id); break;
    case 'delchamp':
      if (!confirm(`Excluir "${c.name}"?`)) return;
      S.champs = S.champs.filter(x => x.id !== c.id); S.cur = S.champs.find(x => !x.external)?.id; S.screen = 'home'; toast('Campeonato excluído'); break;

    /* financeiro */
    case 'expadd': {
      const ds = (val('exdesc') || '').trim(), v = +val('exval');
      if (!ds || !(v > 0)){ toast('Preencha a descrição e o valor'); return; }
      c.expenses.push({id: uid(), desc: ds, cat: val('excat'), value: v}); toast('Despesa lançada'); break;
    }
    case 'expdel': c.expenses = c.expenses.filter(x => x.id !== id); break;
    case 'pix': S.modal = {type:'pix', id}; break;
    case 'markpaid':
      S.modal.paying = true; render();
      setTimeout(() => { team(c, id).paid = true; S.modal = null; toast('PIX confirmado automaticamente ✓'); render(); }, 1800);
      return;

    /* inscrição do capitão */
    case 'signup': S.signup = {champ: id, step: 1, data: {name:'', short:'', cap:'', phone:'', players:''}}; window.scrollTo(0, 0); break;
    case 'snext': {
      const d = S.signup.data, ps = parsePlayers(d.players);
      if (!d.name.trim()){ toast('Digite o nome'); return; }
      if (!d.cap.trim() || d.phone.replace(/\D/g, '').length < 10){ toast('Informe o capitão e um WhatsApp válido'); return; }
      if (ps.length < 2){ toast('Cadastre pelo menos 2 atletas'); return; }
      S.signup.step = 2; break;
    }
    case 'spay':
      S.signup.paying = true; render();
      setTimeout(() => {
        const ch = S.champs.find(x => x.id === S.signup.champ), d = S.signup.data, slot = ch.teams.find(t => t.open);
        if (slot){
          slot.name = d.name.trim(); slot.short = (d.short.trim() || d.name.replace(/[^A-Za-zÀ-ú]/g, '').slice(0, 3)).toUpperCase().slice(0, 3);
          slot.players = parsePlayers(d.players, d.consent !== false); slot.captain = {name: d.cap.trim(), phone: d.phone}; slot.open = false; slot.paid = true; resolveKO(ch);
        }
        S.signup.paying = false; S.signup.step = 3; render();
      }, 2000);
      return;
    case 'sdone': S.pub = S.signup.champ; S.signup = null; if (S.view === 'org') S.view = 'explore'; S.ptab = 'jogos'; window.scrollTo(0, 0); break;

    /* votação e melhores momentos */
    case 'vote': { const l = S.voteLabel; c.votes[l] = c.votes[l] || {}; c.votes[l][id] = (c.votes[l][id] || 0) + 1; S.myVotes[c.id + '|' + l] = id; toast('Voto registrado ⭐'); break; }
    case 'hladd': S.draft = {title:'', game: id || '', player:'', src:'link', url:'', file:null, fileName:''}; S.modal = {type:'hladd'}; break;
    case 'hsrc': S.draft.src = id; break;
    case 'hlsave': {
      const d = S.draft;
      if (!d.title.trim()){ toast('Dê um título ao lance'); render(); return; }
      if (!d.game){ toast('Escolha o jogo'); render(); return; }
      if (d.src === 'file' && needPro(c, 'Enviar vídeos do celular')) return;
      const h = {id: uid(), title: d.title.trim(), game: d.game, player: d.player || null, likes: 0, created: Date.now(), url:''};
      if (d.src === 'link'){
        const u = (d.url || '').trim(); if (!/^https?:\/\//.test(u)){ toast('Cole um link válido'); render(); return; }
        h.url = u; h.type = ytId(u) ? 'youtube' : 'link';
      } else {
        if (!d.file){ toast('Escolha o vídeo'); render(); return; }
        h.type = 'video'; media.put(h.id, d.file).then(ok => { if (!ok) toast('Vídeo disponível só até fechar esta página'); render(); });
      }
      c.highlights.push(h); S.modal = null; S.draft = null; toast('Melhor momento publicado 🎬'); break;
    }
    case 'hldel': if (!confirm('Excluir este vídeo?')) return; c.highlights = c.highlights.filter(h => h.id !== id); media.del(id); break;
    case 'hlplay': if (e.target.closest('[data-act="like"]')) return; S.modal = {type:'hlplay', id}; break;
    case 'like': {
      const h = c.highlights.find(x => x.id === id); if (!h) return;
      if (S.myLikes[id]){ h.likes = Math.max(0, h.likes - 1); delete S.myLikes[id]; } else { h.likes++; S.myLikes[id] = 1; }
      break;
    }

    /* compartilhar, imprimir, exportar */
    case 'copy': navigator.clipboard?.writeText(id).catch(() => {}); toast('Copiado!'); return;
    case 'download': {
      const card = document.getElementById('shareCard'); if (!window.html2canvas){ toast('Sem internet para gerar a imagem'); return; }
      html2canvas(card, {backgroundColor: '#0b1410', scale: 2, useCORS: true}).then(cv => { const a = document.createElement('a'); a.download = `${slug(c.name)}-${slug(S.shareType)}.png`; a.href = cv.toDataURL('image/png'); a.click(); });
      return;
    }
    case 'printtable': printTable(c); return;
    case 'qr': S.modal = {type:'qr'}; break;
    case 'printposter': case 'dlqr': {
      const cv = document.querySelector('#qrbox canvas'), img = cv ? cv.toDataURL('image/png') : null;
      if (!img){ toast('QR indisponível sem internet'); return; }
      if (act === 'dlqr'){ const a = document.createElement('a'); a.href = img; a.download = `qr-${slug(c.name)}.png`; a.click(); return; }
      printDoc('Cartaz', `<div class="poster"><div class="muted" style="font-size:16px">${esc(S.org.arena)}</div><h1>${esc(c.name)}</h1><p style="font-size:16px">Aponte a câmera e acompanhe tabela, jogos e melhores momentos</p><img src="${img}" alt=""><p style="font-size:14px">${DOMAIN}/c/${slug(c.name)}</p>${c.sponsors.length ? `<p class="muted">Patrocínio: ${c.sponsors.map(s => esc(s.name)).join(' · ')}</p>` : ''}</div>`);
      return;
    }
    case 'csvteams':
      download(`${slug(c.name)}-times.csv`, csv([['Time','Sigla','Grupo','Capitão','WhatsApp','Inscrição','Valor','Atletas'], ...c.teams.filter(t => !t.open).map(t => [t.name, t.short, t.group || '', t.captain.name, t.captain.phone, t.paid ? 'Pago' : 'Pendente', c.fee, t.players.map(p => (p.num !== '' ? p.num + ' ' : '') + p.name).join(', ')])]), 'text/csv;charset=utf-8');
      toast('Planilha baixada'); return;
    case 'csvgames':
      download(`${slug(c.name)}-jogos.csv`, csv([['Fase','Data','Hora','Local','Mandante','Gols/Pontos M','Gols/Pontos V','Visitante','Obs','Árbitro'], ...ordered(c).map(g => [g.stage === 'ko' ? g.name : (g.group ? 'Grupo ' + g.group + ' · ' : '') + g.label, g.postponed ? 'Adiado' : g.date, g.time, g.field, sideName(c, g, 'h').name, g.hg ?? '', g.ag ?? '', sideName(c, g, 'a').name, [g.wo ? 'W.O.' : '', g.ph !== null ? `desempate ${g.ph}x${g.pa}` : ''].filter(Boolean).join(' '), staff(g.ref)?.name || ''])]), 'text/csv;charset=utf-8');
      toast('Planilha baixada'); return;
  }
  render();
});

app.addEventListener('change', e => {
  const t = e.target, id = t.id;
  if (id === 'ocolor'){ S.org.color = t.value; render(); }
  if (id === 'ologo' && t.files[0] && !isPro()){ needPro(null, 'Logo da arena'); return; }
  if (id === 'ologo' && t.files[0]) resizeImage(t.files[0], 160, url => { S.org.logo = url; render(); toast('Logo atualizado'); });
  if (id === 'splogo' && t.files[0]) resizeImage(t.files[0], 96, url => { S.spLogo = url; render(); });
  if (id === 'tlogo' && t.files[0]){ readDraftInputs(); resizeImage(t.files[0], 120, url => { S.draft.logo = url; render(); }); }
  if (t.classList.contains('pphoto') && t.files[0]){ readDraftInputs(); const i = +t.dataset.i; resizeImage(t.files[0], 96, url => { S.draft.players[i].photo = url; render(); }); }
  if (id === 'nsport'){ readDraftInputs(); render(); }
  if (id === 'hgame'){ readDraftInputs(); S.draft.player = ''; render(); }
  if (id === 'hfile' && t.files[0]){
    readDraftInputs(); const f = t.files[0];
    if (f.size > 80 * 1024 * 1024){ toast('Vídeo maior que 80 MB'); return; }
    S.draft.file = f; S.draft.fileName = f.name; render();
  }
  if (id === 'sgame'){ S.shareGame = t.value; render(); }
  if (id === 'excity'){ S.exCity = t.value; render(); }
  if (id === 'agdate'){ S.agDate = t.value; render(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'exq'){ S.exq = e.target.value; const el = document.getElementById('exlist'); if (el) el.innerHTML = exploreList(); }
  if (e.target.id === 'myq'){ S.myq = e.target.value; const el = document.getElementById('mylist'); if (el) el.innerHTML = myList(); }
});

let tick = 0;
setInterval(() => {
  if (S.tour && S.tour.auto && Date.now() - S.tour.t > (TOUR[S.tour.i].ms || 6500)){
    if (S.tour.i < TOUR.length - 1) tourGo(S.tour.i + 1); else { S.tour.auto = false; render(); }
  }
  const c = cur(); if (!c) return; tick++;
  if (S.screen === 'sumula' || S.mesario){ const g = c.games.find(x => x.id === (S.mesario || S.gid)); const el = document.getElementById('clock'); if (g && el) el.textContent = fmtClock(elapsed(g)); }
  if (S.view !== 'org' && S.pub && !S.signup && !S.modal && !S.mesario && c.games.some(g => g.live) && tick % 5 === 0) render();
}, 1000);

render();
</script>
</body>
</html>
